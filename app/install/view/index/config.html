<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ZhiCms安装向导</title>
    <link rel="stylesheet" href="{__PUBLIC__}install/amazeui.min.css">
    <link rel="stylesheet" href="{__PUBLIC__}/install/css/style.css">
    <script type="text/javascript" src="{__PUBLIC__}install/jquery.min.js"></script>
    <script type="text/javascript" src="{__PUBLIC__}install/amazeui.js"></script>
</head>
<body>
<div class="zhicms-body">
    <div class="zhicms-head">ZhiCms值得买系统 <span class="ver">{v4.0.0}</span>
        <small>安装向导</small>
    </div>
    <div class="am-cf">
        <div class="zhicms-menu">
            <ul class="am-nav">
                <li><a href="#">1. 使用协议</a></li>
                <li><a href="#">2. 环境检测</a></li>
                <li class="am-active"><a href="#">3. 配置参数</a></li>
                <li><a href="#">4. 完成安装</a></li>
            </ul>
        </div>
        <div class="zhicms-main">
            <div class="am-progress">
                <div class="am-progress-bar" style="width: 33%">易用</div>
                <div class="am-progress-bar am-progress-bar-success" style="width: 34%">扩展</div>
                <div class="am-progress-bar am-progress-bar-warning" style="width: 33%">开源</div>
            </div>
            <form class="am-form am-form-horizontal" action="index.php?r=install/index/start" method="post"  id="form"  >
                <h1 class="zhicms-title">
                    数据库参数(没有特殊情况，php7以上环节，数据库驱动默认即可，否则请选择Mysql驱动)，如果不懂选择，请到交流群咨询！
                </h1>
                <div class="zhicms-content">
                    <div class="am-form-group">
                        <label class="am-u-sm-3 am-form-label">数据库驱动[不是选择数据库类型]</label>
                        <div class="am-u-sm-9">
                           <select name="type"> 
                            <option value="Mysqlpdo" selected="selected">MysqlPDO[强烈推荐]</option>
							<option value="Mysql">Mysql[php5.6及以下]</option>
                           
                           </select>
                        </div>
                    </div>
					<h1 class="zhicms-title">
                   ZhiCms默认仅支持MySQL数据库，请仔细填写数据库连接！，务必填写正确数据库信息，如果填写错误请重新下载新包！
                </h1>
                    <div class="am-form-group">
                        <label class="am-u-sm-3 am-form-label">数据库地址</label>
                        <div class="am-u-sm-9">
                            <input type="text" name="host" value="localhost" required>
                        </div>
                    </div>
                    <div class="am-form-group">
                        <label class="am-u-sm-3 am-form-label">数据库端口</label>
                        <div class="am-u-sm-9">
                            <input type="text" name="port" value="3306" required>
                        </div>
                    </div>
                    <div class="am-form-group">
                        <label class="am-u-sm-3 am-form-label">数据库名称</label>
                        <div class="am-u-sm-9">
                            <input type="text" name="dbname" value="" required>
                        </div>
                    </div>
                    <div class="am-form-group">
                        <label class="am-u-sm-3 am-form-label">数据库用户名</label>
                        <div class="am-u-sm-9">
                            <input type="text" name="dbuser" value="root" required>
                        </div>
                    </div>
                    <div class="am-form-group">
                        <label class="am-u-sm-3 am-form-label">数据库密码</label>
                        <div class="am-u-sm-9">
                            <input type="text" name="password" value="">
                        </div>
                    </div>
                  
                </div>

                <h1 class="zhicms-title" style="margin-top: 0; padding-top: 10px;">
                    管理员参数
                </h1>

                <div class="zhicms-content">
                    <div class="am-form-group">
                        <label class="am-u-sm-3 am-form-label">账号</label>
                        <div class="am-u-sm-9">
                            <input type="text" name="admin_user" value="admin" required>
                        </div>
                    </div>
                    <div class="am-form-group">
                        <label class="am-u-sm-3 am-form-label">密码</label>
                        <div class="am-u-sm-9">
                            <input type="text" name="admin_pw" value="" required>
                        </div>
                    </div>
                </div>

                <div class="zhicms-fun am-cf">
                    <a class="am-btn am-btn-default am-fl" href="{url('detect')}">上一步</a>
                    <button type="submit" class="am-btn am-btn-primary am-fr">下一步</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
