{include file="app/index/view/public/header"}

<div class="container mw-420" style="padding:40px 0">
    <div class="card" style="border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08);">
        <div class="card-body p-4">
            <h4 class="mb-3 text-center" style="font-weight:600;">用户注册</h4>

            {if !$showEntry}
            <div class="alert alert-warning">站点未开启用户注册入口。</div>
            {else}

            <form id="regForm">
                <div class="form-group mb-3">
                    <label>手机号</label>
                    <input type="text" class="form-control" name="mobile" id="mobile" placeholder="请输入手机号" maxlength="11">
                </div>
                <div class="form-group mb-3">
                    <label>密码</label>
                    <input type="password" class="form-control" name="password" id="password" placeholder="至少 6 位" maxlength="32">
                </div>
                <div class="form-group mb-3">
                    <label>确认密码</label>
                    <input type="password" class="form-control" name="repassword" id="repassword" placeholder="再次输入密码" maxlength="32">
                </div>
                <div class="form-group mb-3">
                    <label>邮箱（选填）</label>
                    <input type="text" class="form-control" name="email" id="email" placeholder="用于找回密码，可留空" maxlength="100">
                </div>
                {if $regCaptcha}
                <div class="form-group mb-3">
                    <label>图形验证码</label>
                    <div class="input-group">
                        <input type="text" class="form-control" name="captcha" id="captcha" placeholder="请输入右侧验证码" maxlength="4">
                        <span class="input-group-append">
                            <img src="index.php?r=index/login/captcha" onclick="this.src='index.php?r=index/login/captcha&t='+Date.now()" title="点击刷新" class="h-38 cur-pointer" style="border-radius:0 4px 4px 0">
                        </span>
                    </div>
                </div>
                {/if}
                <button type="button" class="btn btn-primary btn-block btn-lg w-full" onclick="doReg()">注册</button>
            </form>

            <div class="text-center mt-3">
                <a href="{url($route='index/login/index', $params=array())}">已有账号？去登录</a>
            </div>
            {/if}
        </div>
    </div>
</div>

{include file="app/index/view/public/footer"}

<script>
function doReg(){
    var mobile = document.getElementById('mobile').value.trim();
    var password = document.getElementById('password').value;
    var repassword = document.getElementById('repassword').value;
    var email = document.getElementById('email').value.trim();
    {if $regCaptcha}
    var captcha = document.getElementById('captcha').value.trim();
    {else}
    var captcha = '';
    {/if}
    if (!mobile || !password) { showToast('请输入手机号和密码', 'danger'); return; }
    var fd = new FormData();
    fd.append('mobile', mobile);
    fd.append('password', password);
    fd.append('repassword', repassword);
    fd.append('email', email);
    fd.append('captcha', captcha);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=index/login/doReg', true);
    xhr.onreadystatechange = function(){
        if (xhr.readyState !== 4) return;
        if (xhr.status !== 200) { showToast('请求失败', 'danger'); return; }
        try {
            var res = JSON.parse(xhr.responseText);
            if (res.status === 'y') {
                showToast(res.info, 'success');
                setTimeout(function(){ location.href = 'index.php?r=index/ucenter/index'; }, 900);
            } else {
                showToast(res.info || '注册失败', 'danger');
            }
        } catch(e) { showToast('注册失败', 'danger'); }
    };
    xhr.send(fd);
}
</script>
