{include file="app/index/view/public/header"}

<div class="container mw-420" style="padding:40px 0">
    <div class="card" style="border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08);">
        <div class="card-body p-4">
            <h4 class="mb-3 text-center" style="font-weight:600;">用户登录</h4>

            {if !$showEntry}
            <div class="alert alert-warning">站点未开启用户登录/注册入口。</div>
            {else}

            <form id="loginForm">
                <div class="form-group mb-3">
                    <label>手机号</label>
                    <input type="text" class="form-control" name="mobile" id="mobile" placeholder="请输入手机号" maxlength="11">
                </div>
                <div class="form-group mb-3">
                    <label>密码</label>
                    <input type="password" class="form-control" name="password" id="password" placeholder="请输入密码" maxlength="32">
                </div>
                <button type="button" class="btn btn-primary btn-block btn-lg w-full" onclick="doLogin()">登录</button>
            </form>

            <div class="text-center mt-3">
                <a href="{url($route='index/login/register', $params=array())}">还没有账号？立即注册</a>
            </div>
            {/if}
        </div>
    </div>
</div>

{include file="app/index/view/public/footer"}

<script>
function doLogin(){
    var mobile = document.getElementById('mobile').value.trim();
    var password = document.getElementById('password').value;
    if (!mobile || !password) { showToast('请输入手机号和密码', 'danger'); return; }
    var fd = new FormData();
    fd.append('mobile', mobile);
    fd.append('password', password);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=index/login/doLogin', true);
    xhr.onreadystatechange = function(){
        if (xhr.readyState !== 4) return;
        if (xhr.status !== 200) { showToast('请求失败', 'danger'); return; }
        try {
            var res = JSON.parse(xhr.responseText);
            if (res.status === 'y') {
                showToast(res.info, 'success');
                setTimeout(function(){ location.href = 'index.php?r=index/ucenter/index'; }, 900);
            } else {
                showToast(res.info || '登录失败', 'danger');
            }
        } catch(e) { showToast('登录失败', 'danger'); }
    };
    xhr.send(fd);
}
</script>
