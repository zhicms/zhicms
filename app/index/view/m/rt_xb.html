    <template id="sfc-main">
      <div data-v-fd407ccd class="page-container" v-cloak>
        <!-- 顶部Banner -->
        <div data-v-fd407ccd class="banner-wrapper">
          <img data-v-fd407ccd class="free-banner" :src="banner" alt="" />
        </div>

        <!-- 搜索 + 频道导航 -->
        <div data-v-fd407ccd class="search-input-wrap">
          <van-search v-model="searchValue" show-action placeholder="搜索全网折扣、优惠券..." @search="onSearch" @clear="onSearchClear" @focus="suggest.focus=true" @blur="onSuggestBlur" @input="getSuggest">
            <template v-slot:action><div @click="onSearch">搜索</div></template>
          </van-search>
          <ul class="tb-suggest" v-show="suggest.list.length && suggest.focus">
            <li v-for="(w,i) in suggest.list" v-on:click="pickSuggest(w)" v-html="hl(w)"></li>
          </ul>
        </div>
        <ul data-v-fd407ccd class="channel-nav">
          <li class="item" v-for="(item,index) in mChannel.list" v-bind:class="{active: mChannel.activeIndex===index}" v-on:click="goChannel(item,index)"><span>{{item.label}}</span></li>
        </ul>

        <!-- 内容区域 -->
        <div data-v-fd407ccd ref="listRef" class="page-content" :class="{ 'empty-list': !listData.length }">
          <!-- 分类导航 -->
          <ul data-v-fd407ccd class="nav">
            <li data-v-fd407ccd v-for="(item, index) in nav.list" :key="item.type_id" class="btn" :class="{ active: index === nav.activeIndex }" @click="onNavChange(index)">{{ item.type_name }}</li>
          </ul>

          <!-- 商品列表（频道 tab 时）/ 线报列表 -->
          <div data-v-fd407ccd class="lists">
            <template data-v-fd407ccd v-if="listData.length || finished">
              <template data-v-fd407ccd v-if="currentType !== 'index'">
                <product-item data-v-fd407ccd v-for="(item, index) in listData" :key="index" class="free-item" :item="item" :on-transfer="handleGoodsTransfer" @buy="handleGoodsTransfer"></product-item>
              </template>
              <template data-v-fd407ccd v-else>
                <list-item data-v-fd407ccd v-for="(item, index) in listData" :key="index" class="free-item" :item="item" :title="activeNav?.type_name || ''" :on-transfer="handleGoodsTransfer" @buy="handleGoodsTransfer"></list-item>
              </template>
              <div data-v-fd407ccd class="list-item-loading">
                <span data-v-fd407ccd v-if="finished">没有更多商品了~</span>
                <span data-v-fd407ccd v-else>数据正在赶来的路上...</span>
              </div>
            </template>
          </div>
        </div>

        <!-- 返回顶部 -->
        <draggable-back-top data-v-fd407ccd :threshold="1000"></draggable-back-top>
