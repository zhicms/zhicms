<!DOCTYPE html>
<html>
  <head>
    <title>小样种草机</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.efengqing.com/ajax/libs/minireset.css/0.0.2/minireset.css">
    <link rel="stylesheet" href="https://at.alicdn.com/t/font_1534407_mj4m6393aya.css">
    <script src="https://cdnjs.efengqing.com/ajax/libs/promise-polyfill/8.2.0/polyfill.min.js"></script>
    <script src="https://cdnjs.efengqing.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    <script src="https://cdnjs.efengqing.com/ajax/libs/vue/3.0.11/vue.global.js"></script>
    <script src="https://cdnjs.efengqing.com/ajax/libs/vant/3.2.4/vant.min.js"></script>
    <script src="https://img.bc.haodanku.com/cms/SpaUtils.min.js"></script>
    <script src="https://img.bc.haodanku.com/cdn/vant-touch-emulator.js"></script>
    <link href="https://cdnjs.efengqing.com/ajax/libs/vant/3.2.4/index.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://img.bc.haodanku.com/cdn/locss.css">
    <meta name="referrer" content="no-referrer">
    <script src="https://img.bc.haodanku.com/cdn/tsUtils.js"></script>
    <script defer>document.write('<link rel="stylesheet" href="https://img.bc.haodanku.com/cms/tb_minishop.css?t=' + (Date.now() - Date.now() % (60 * 1000 * 30)) + '"/>')</script>
  <style>
    /* 移动端频道导航 + 淘宝联想下拉（自包含，避免与 tb_minishop.css 冲突） */
    .search-box .search-input-wrap{position:relative;}
    .tb-suggest{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#fff;border-radius:10px;z-index:80;max-height:300px;overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 10px 28px rgba(0,0,0,.18);}
    .tb-suggest li{padding:12px 16px;font-size:15px;color:#333;border-bottom:1px solid #f4f4f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s ease,color .15s ease;}
    .tb-suggest li:last-child{border-bottom:0;}
    .tb-suggest li:active{background:#fff3e8;color:#ff5000;}
    .tb-suggest li .hl{color:#ff5000;font-style:normal;}
    .channel-nav{display:flex;align-items:stretch;background:#fff;border-top:1px solid #f1f1f1;}
    .channel-nav .item{flex:1;text-align:center;padding:13px 0 11px;font-size:15px;line-height:1.1;color:#888;background:transparent;position:relative;cursor:pointer;transition:color .25s ease, background .2s ease;}
    .channel-nav .item:active{background:#f6f6f6;}
    .channel-nav .item.active{color:#ff5000;font-weight:700;}
    .channel-nav .item.active:after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:24px;height:3px;border-radius:2px;background:linear-gradient(135deg,#ff7a18,#ff5000);animation:navInd .25s ease;}
    @keyframes navInd{from{opacity:0;transform:translateX(-50%) scaleX(.4);}to{opacity:1;transform:translateX(-50%) scaleX(1);}}
    .empty-tip{text-align:center;color:#ffb38a;padding:1.2rem .3rem;font-size:.28rem;}
    .empty-tip .iconfont{display:block;font-size:.8rem;margin-bottom:.15rem;color:#ff7a18;}
    .empty-tip p{margin:0;}
  </style>
  </head>
  <body>
    <template id="c-card">
      <div class="card row _ flex-c">
        <img class="cover" v-lazy="item.itempic" v-if="item.itempic"/>
        <img
          class="cover"
          src="http://img.bc.fqapps.com/fudai13cae4ae6ef16739ed3b100a2ec39e97.gif"
          alt=""
          v-else
        />
        <div class="detail">
          <div class="title">
            <span>{{ item.itemshorttitle || item.itemtitle }}</span>
          </div>
          <div class="shop-name-warp">
            <div class="shop-name _ flex-c" v-if="item.shopname">
              <img v-if="item.shopname" class="icon" src="https://img.bc.haodanku.com/cms/1646039788" :alt="item.shop_name"/>
              <span v-if="item.shopname" class="value">{{ item.shopname }}</span>
            </div>
          </div>
          <div class="tags">
            <div v-for="tab in item.new_label" class="tag _ flex-c-c">{{tab}}</div>
          </div>
          <div class="price">
            <div class="end-price">
              <div class="label">抢购价</div>
              <div class="value">￥<strong>{{ Number(item.itemendprice) }}</strong></div>
            </div>
            <div class="origin">
              <del>￥{{ Number(item.itemprice) }}</del>
            </div>
          </div>
          <div class="btn-block">
            <div class="_ btn btn-order">
              <span v-on:click.capture="buy">立即下单</span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <div id="single-page-app" v-cloak>
      <van-pull-refresh v-model="refreshing" @refresh="reGetListData">
        <van-list class="page-container" v-bind:loading="listData.loading" v-bind:finished="listData.finished"
                  v-on:load="getListData"><!-- 底部提示 -->
          <template v-slot:finished v-if="listData.list.length"><span class="list-item-loading">-优惠到底啦-</span></template>
          <template v-slot:loading><span class="list-item-loading">数据正在赶来的路上...</span></template>
          <div class="banner-wrapper" ref="bannerRef"><img class="free-banner" v-bind:src="banner" alt=""></div>
          <van-sticky class="fixed-box">
            <div class="free-navbar">
              <div class="free-navbar-class">
                <span class="active-bg" v-bind:style="{left:(switchData.activeIndex / switchData.list.length * 100) + '%',width:(100/switchData.list.length)+'%'}"></span>
                <span v-for="(item, index) in switchData.list" v-bind:class="{'active': item.value == switchData.selected}" v-on:click="handleNavbar(item, index)">
                  <img :src="item.image" alt="">
                  <div>{{ item.name }}</div>
                </span>
              </div>
            </div>
            <div class="search-input-wrap">
            <van-search v-model="searchValue" show-action placeholder="搜索全网折扣、优惠券..." @search="onSearch"
                        @clear="onSearchClear" @focus="suggest.focus=true" @blur="onSuggestBlur" @input="getSuggest">
              <template v-slot:action>
                <div class="_ flex-c-c" @click="onSearch">搜索</div>
              </template>
            </van-search>
            <ul class="tb-suggest" v-show="suggest.list.length && suggest.focus">
              <li v-for="(w, i) in suggest.list" v-on:click="pickSuggest(w)" v-html="hl(w)"></li>
            </ul>
            </div>
            <ul class="channel-nav">
              <li class="item" v-for="(item, index) in nav.list" v-bind:class="{active: nav.activeIndex === index}" v-on:click="goChannel(item, index)">
                <span>{{item.label}}</span>
              </li>
            </ul>
          </van-sticky>
          <div class="page-content" ref="list" v-bind:class="{'empty-list':!listData.list.length}">
            <div class="lists" ref="listsRef" v-if="listData.list.length || listData.finished">
              <card v-for="(item, index) in listData.list" v-bind:item="item" v-bind:key="item.itemid"
                    v-on:transfer="handleGoodsTransfer"></card>
            </div>
            <div class="empty" v-show="!listData.list.length &amp;&amp; !loading">
              <div class="empty-box"><img src="http://img.bc.haodanku.com/cms/1627883509">
                <div class="text">暂无数据~</div>
              </div>
            </div>
          </div>
        </van-list>
      </van-pull-refresh>
      <div class="back-top-wrap max-width" v-movable>
        <div class="_ btn back-top" v-on:click="backTop" v-bind:class="{hide: scrollTop &lt; 600}"></div>
      </div>
      <van-overlay v-bind:show="loading">
        <van-loading color="#0094ff"></van-loading>
      </van-overlay>
    </div>
    <script>
      function useBase() {
  const listDataStr = JSON.stringify({
    list: [],
    loading: false,
    finished: false,
    min_id: 1,
    pageTotal: 1,
    pageCurrent: 0
  });

  const scrollTop = Vue.ref(0);
  const listData = Vue.reactive(JSON.parse(listDataStr));

  // 根据微信浏览器缩放比例设置rem缩放
  if(SpaUtils.inWechat() && "ontouchstart" in window) {
    const scale = SpaUtils.getFontScale(true);
    document.documentElement.style.fontSize =
      "calc(13.33333vw * " + scale + ")";
  }

  return {
    listDataStr,
    data: {
      scrollTop,
      listData
    },
    useScrollEndMounted(onScrollEnd, onNotScrollEnd) {
      Vue.onMounted(function() {
        window.addEventListener("scroll", function(ev) {
          scrollTop.value = document.documentElement.scrollTop || document.body.scrollTop;
          if(SpaUtils.isScrollEnd(this, "vertical", 40)) {
            onScrollEnd && onScrollEnd();
          } else {
            onNotScrollEnd && onNotScrollEnd();
          }
        });
      });
    },
    methods: {
      onScrollEnd() {
        this.getListData();
      },
      handleShare() {
        SpaUtils.copy(location.href, "复制成功，快去下单吧~");
      },
      resetListData(isCleanList = true) {
        Object.assign(
          listData,
          JSON.parse(listDataStr),
          isCleanList ? undefined : {list: listData.list}
        );
      }
    }
  };
}function getComponents() {
  const Card = Vue.defineComponent({
    template: "#c-card",
    props: {
      item: Object
    },
    emits: ["transfer"],
    setup(props, ctx) {
      return {
        buy(e, type = "buy") {
          ctx.emit("transfer", {e, item: props.item, type});
        },
        getMoneyStr: SpaUtils.numWan
      };
    }
  });
  return {card: Card};
}

    </script>
    <script>window.onload = function() {
  const stamp = Date.now() - (Date.now() % (60 * 1000 * 30));
  const app = Vue.createApp({
    name: "App",
    directives: {
      movable: SpaUtils.movable
    },
    components: getComponents(),
    setup() {
      const {
        data: baseData,
        methods: baseMethods,
        useScrollEndMounted
      } = useBase();
      const customParams = useCustomParams();
      const data = {
        ...baseData,
        banner: "https://img.bc.haodanku.com/cms/1646037895?t=" + stamp,
        top: 0,
        loading: Vue.ref(false),
        refreshing: Vue.ref(false),
        isScrollToDown: Vue.ref(false),
        searchValue: Vue.ref(""),
        currentType: Vue.ref("index"),
        tabPage: Vue.ref(1),
        suggest: Vue.reactive({ list: [], focus: false }),
        nav: Vue.reactive({
          list: [
            { label: "首页", key: "index" },
            { label: "风云榜", key: "rank" },
            { label: "热榜", key: "hot" },
            { label: "大牌", key: "brand" },
            { label: "优惠券", key: "cheaps" }
          ],
          activeIndex: 0
        }),
        from: SpaUtils.parseSearch().from || 1,
        switchData: Vue.reactive({
          list: [
            {
              name: "淘宝",
              value: 1,
              image: 'https://img.bc.haodanku.com/cms/1695880541'
            },
            {
              name: "京东",
              value: 2,
              image: 'https://img.bc.haodanku.com/cms/1695880549'
            },
          ],
          selected: 1,
          activeIndex: 0
        }),
        ...customParams
      };
      const methods = {
        ...baseMethods,
        handleNavbar: function(item, index) {
          if(data.listData.loading || data.switchData.activeIndex === index) return;
          data.switchData.activeIndex = index;
          data.switchData.selected = item.value;
          methods.backTopAndReGetListData()
        },
        backTop() {
          $("html,body").animate({scrollTop: 0});
        },
        backTopAndReGetListData() {
          methods.resetListData(false);
          methods.backTop();
          return methods.getListData(true);
        },
        reGetListData() {
          methods.resetListData(false);
          return methods.getListData(true);
        },
        onSearchClear() {
          data.searchValue.value = "";
          methods.backTopAndReGetListData();
        },
        onSearch() {
          methods.backTopAndReGetListData();
        },
        goChannel(item, index) {
          if(data.nav.activeIndex === index && data.currentType.value === item.key) {
            methods.backTop();
            return;
          }
          data.nav.activeIndex = index;
          data.currentType.value = item.key;
          data.tabPage.value = 1;
          data.suggest.list = [];
          methods.backTop();
          methods.reGetListData();
        },
        pickSuggest(w) {
          data.searchValue.value = w;
          data.suggest.list = [];
          data.suggest.focus = false;
          methods.onSearch();
        },
        onSuggestBlur() {
          const that = data;
          setTimeout(function() { that.suggest.focus = false; }, 200);
        },
        hl(w) {
          const q = (data.searchValue.value || "").trim();
          w = String(w);
          if(!q) return methods.escapeHtml(w);
          const idx = w.toLowerCase().indexOf(q.toLowerCase());
          if(idx < 0) return methods.escapeHtml(w);
          return methods.escapeHtml(w.slice(0, idx)) + '<em class="hl">' + methods.escapeHtml(w.slice(idx, idx + q.length)) + "</em>" + methods.escapeHtml(w.slice(idx + q.length));
        },
        escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, function(c) {
            return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;""}[c];
          });
        },
        getSuggest() {
          const q = data.searchValue.value;
          if(!q) { data.suggest.list = []; return; }
          SpaUtils.Request.get('{url($route="api/goods/hdksuggest", $params=array())}' + '&keyword=' + encodeURIComponent(q)).promise.then(function(res){
            const d = (res && res.data) || [];
            data.suggest.list = d.map(function(it){ return it.keyword || it; }).slice(0, 10);
          }).catch(function(){ data.suggest.list = []; });
        },
        async getServerTabData(clean) {
          const loading = data.loading;
          const listData = data.listData;
          if(loading.value || listData.loading || listData.finished) return Promise.reject();
          listData.loading = true;
          if(clean) loading.value = true;
          const params = {
            act: "tab",
            type: data.currentType.value,
            p: data.tabPage.value,
            keyword: data.searchValue.value
          };
          return $.ajax({ url: "/m.html", data: params, dataType: "json", type: "GET" }).then(function(res){
            const list = (res && res.data) ? res.data : [];
            setTimeout(function(){
              listData.list = clean ? list : listData.list.concat(list);
              listData.finished = Boolean(res && res.finished) || !list.length;
              data.tabPage.value = (res && res.next_page) ? res.next_page : (data.tabPage.value + 1);
              loading.value = false;
              listData.loading = false;
              data.refreshing.value = false;
            }, 150);
          }).catch(function(){
            listData.list = [];
            listData.finished = true;
            loading.value = false;
            listData.loading = false;
            data.refreshing.value = false;
          });
        },
        async getListData(clean) {
          if(data.currentType.value && data.currentType.value !== "index") {
            return methods.getServerTabData(clean);
          }
          const loading = data.loading;
          const listData = data.listData;
          if(loading.value || listData.loading || listData.finished) return Promise.reject();
          listData.loading = true;
          if(clean) {
            loading.value = true;
          }
          try {
            const min_size = 10;
            const param = {
              ...customParams.getListDataParams(),
              keyword: data.searchValue.value,
              min_id: data.listData.min_id,
              back: min_size,
              type: data.switchData.selected
            };
            const url = '{url($route="api/goods/hdkproxy", $params=array("_target"=>"makeup_items"))}';
            const res = await SpaUtils.Request.get(url, param).promise;
            const list = res.data || [];

            setTimeout(() => {
              listData.list = clean ? list : listData.list.concat(list);
              listData.finished =
                listData.min_id == res.min_id ||
                !list.length ||
                list.length < min_size;
              listData.min_id = res.min_id || listData.min_id;
            }, 200);
            return res;
          } catch(e) {
            listData.list = [];
            listData.finished = true;
          } finally {
            setTimeout(() => {
              listData.loading = false;
              loading.value = false;
              data.refreshing.value = false;
            }, 200);
          }
        },
        /**
         * 商品转链
         * @param e {MouseEvent}
         * @param item
         */
        async handleGoodsTransfer({e, item}) {
          console.log('type', data.switchData.selected);
          let type = data.switchData.selected;
          if (type == 1) {
            const param = {
              itemid: item.itemid,
              title: item.itemshorttitle || item.itemtitle,
              pid: "__HDK_TB_PID__", //淘宝PID 必填
              tb_name: "__HDK_TB_NAME__", //好单库后台已授权的淘宝昵称 必填
              get_taoword: 1,
              ...customParams.getTransferParams()
            };

            const loading = data.loading;
            loading.value = true;
            try {
              // 走本机 Tjk 转链（替代好单库 ratesurl）
              const transferUrl = '{url($route="api/goods/transfer", $params=array("platform"=>"tb"))}';
              const params = {
                platformType: "tb",
                itemData: item,
                url: customParams.getTransferUrl ? customParams.getTransferUrl() : transferUrl,
                el: e.target,
                data: param,
                copySuccessMsg: "复制口令成功,请打开淘宝领取",
                requestCB(res) {
                },
                getCopyTarget(res) {
                  if(typeof res.data === "object") {
                    return "0" + res.data.taoword + "/";
                  }
                  return res.data;
                }
              };
              const utils = window.SdkUtils || window.SpaUtils;
              await utils.conversionLink(params);
            } catch(e) {
              SpaUtils.toast(e.msg || "转链失败");
            } finally {
              setTimeout(function() {
                loading.value = false;
              }, 200);
            }
          } else {
            const param = {
              material_id: item.itemid,
              title: item.itemshorttitle || item.itemtitle,
              union_id: "__HDK_JD_UNION__", //京东unionID 必填
              pid: "__HDK_JD_PID__", //京东PID
              ...customParams.getTransferParams()
            };

            const loading = data.loading;
            loading.value = true;
            try {
              // 走本机 Tjk 转链（替代好单库 get_jditems_link）
              const transferUrl = '{url($route="api/goods/transfer", $params=array("platform"=>"jd"))}';
              const params = {
                platformType: "jd",
                itemData: item,
                url: transferUrl,
                el: e.target,
                data: param,
                copySuccessMsg: "链接复制成功~",
                requestCB(res) {
                },
                getCopyTarget(res) {
                  if(typeof res.data === "object") {
                    return res.short_url
                  }
                  return res.short_url;
                }
              };
              const utils = window.SdkUtils || window.SpaUtils;
              await utils.conversionLink(params);
            } catch(e) {
              SpaUtils.toast(e.msg || "转链失败");
            } finally {
              setTimeout(function() {
                loading.value = false;
              }, 200);
            }
          }
        }
      };

      function init() {
        useScrollEndMounted();
        Vue.watch(baseData.scrollTop, (n, o) => {
          data.isScrollToDown.value = n > o;
        });
      }

      init();
      return {...data, ...methods};
    }
  });
  app.use(vant);
  app.use(vant.Lazyload, {
    lazyComponent: true,
    preLoad: 1.3,
    error: "http://img.bc.haodanku.com/haodanku/1595237918",
    loading:
      "http://img.bc.fqapps.com/fudai13cae4ae6ef16739ed3b100a2ec39e97.gif",
    attempt: 1
  });
  app.mount("#single-page-app");
};

    </script>
    <script>
      function useCustomParams() {
        const customParams = {
          apikey: "__HDK_APIKEY__", //必填
        }
        return {
          customParams,
          // 获取列表数据参数
          getListDataParams() {
            return {apikey: customParams.apikey}
          },
          // 转链参数
          getTransferParams(item) {
            return {...customParams};
          }
        }
      }
    </script>
  </body>
</html>
