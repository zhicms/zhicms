<!-- AI 购物助手 - 悬浮聊天组件 -->
<style>
/* ========== AI助手悬浮按钮 ========== */
.ai-assistant-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff2e54, #ff6b81);
  box-shadow: 0 4px 16px rgba(255, 46, 84, 0.4);
  cursor: pointer;
  z-index: 9998;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .3s ease;
  border: none;
  outline: none;
}
.ai-assistant-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 24px rgba(255, 46, 84, 0.5);
}
.ai-assistant-btn .ai-btn-icon {
  font-size: 28px;
  color: #fff;
  line-height: 1;
}
.ai-assistant-btn .ai-btn-tip {
  position: absolute;
  right: 72px;
  top: 50%;
  transform: translateY(-50%);
  background: #333;
  color: #fff;
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 20px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}
.ai-assistant-btn:hover .ai-btn-tip {
  opacity: 1;
}
.ai-assistant-btn .ai-btn-tip::after {
  content: '';
  position: absolute;
  right: -6px;
  top: 50%;
  transform: translateY(-50%);
  border: 6px solid transparent;
  border-left-color: #333;
  border-right: none;
}

/* 呼吸动画 */
@keyframes ai-breath {
  0%, 100% { box-shadow: 0 4px 16px rgba(255, 46, 84, 0.4); }
  50% { box-shadow: 0 4px 28px rgba(255, 46, 84, 0.7); }
}
.ai-assistant-btn.breathing {
  animation: ai-breath 2s ease-in-out infinite;
}

/* 未读消息小红点 */
.ai-assistant-btn .ai-dot {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #ff2e54;
  display: none;
}
.ai-assistant-btn .ai-dot.show {
  display: block;
}

/* ========== 聊天面板 ========== */
.ai-chat-panel {
  position: fixed;
  bottom: 100px;
  right: 30px;
  width: 380px;
  height: 560px;
  max-height: calc(100vh - 120px);
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,.15);
  z-index: 9999;
  display: none;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #e8e8e8;
}
.ai-chat-panel.open {
  display: flex;
}

/* ---------- 面板头部 ---------- */
.ai-chat-header {
  background: linear-gradient(135deg, #ff2e54, #ff6b81);
  color: #fff;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.ai-chat-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.ai-chat-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.ai-chat-title {
  font-size: 15px;
  font-weight: 600;
}
.ai-chat-subtitle {
  font-size: 11px;
  opacity: .8;
  margin-top: 1px;
}
.ai-chat-identity {
  font-size: 11px;
  margin-top: 3px;
  opacity: .92;
  display: flex;
  align-items: center;
  gap: 5px;
}
.ai-chat-identity .ai-id-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ffd54f;
  flex-shrink: 0;
}
.ai-chat-identity.login .ai-id-dot {
  background: #69f0ae;
}
.ai-chat-identity.login {
  color: #eafff2;
}
.ai-chat-actions {
  display: flex;
  gap: 8px;
}
.ai-chat-actions button {
  background: rgba(255,255,255,.2);
  border: none;
  color: #fff;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  transition: background .2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ai-chat-actions button:hover {
  background: rgba(255,255,255,.35);
}

/* ---------- 消息区域 ---------- */
.ai-chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  background: #f8f9fa;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ai-chat-body::-webkit-scrollbar {
  width: 5px;
}
.ai-chat-body::-webkit-scrollbar-thumb {
  background: #ddd;
  border-radius: 3px;
}

/* 欢迎卡片 */
.ai-welcome-card {
  text-align: center;
  padding: 20px 10px;
}
.ai-welcome-icon {
  font-size: 48px;
  margin-bottom: 10px;
}
.ai-welcome-title {
  font-size: 16px;
  font-weight: 600;
  color: #333;
  margin-bottom: 6px;
}
.ai-welcome-desc {
  font-size: 13px;
  color: #888;
  line-height: 1.6;
}
.ai-quick-words {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 12px;
}
.ai-quick-word {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 16px;
  padding: 5px 12px;
  font-size: 12px;
  color: #555;
  cursor: pointer;
  transition: all .2s;
}
.ai-quick-word:hover {
  border-color: #ff2e54;
  color: #ff2e54;
  background: #fff5f5;
}
.ai-quick-refresh {
  display: inline-block;
  margin-top: 10px;
  font-size: 11px;
  color: #aaa;
  cursor: pointer;
  user-select: none;
  transition: color .2s;
}
.ai-quick-refresh:hover {
  color: #ff2e54;
}
.ai-quick-words.rotating .ai-quick-word {
  animation: ai-fade-in .35s ease;
}
@keyframes ai-fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 消息气泡 */
.ai-msg {
  display: flex;
  gap: 8px;
  max-width: 90%;
  animation: ai-msg-in .3s ease;
}
@keyframes ai-msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.ai-msg.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.ai-msg.assistant {
  align-self: flex-start;
}
.ai-msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.ai-msg.user .ai-msg-avatar {
  background: #e8f5e9;
}
.ai-msg.assistant .ai-msg-avatar {
  background: #fce4ec;
}
.ai-msg-bubble {
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}
.ai-msg.user .ai-msg-bubble {
  background: #ff2e54;
  color: #fff;
  border-bottom-right-radius: 4px;
}
.ai-msg.assistant .ai-msg-bubble {
  background: #fff;
  color: #333;
  border: 1px solid #eee;
  border-bottom-left-radius: 4px;
}

/* 助手消息内的链接样式 */
.ai-msg.assistant .ai-msg-bubble a {
  color: #ff2e54;
  text-decoration: none;
  font-weight: 500;
}
.ai-msg.assistant .ai-msg-bubble a:hover {
  text-decoration: underline;
}

/* 商品卡片（在聊天中） */
.ai-product-header {
  font-size: 13px;
  color: #555;
  margin-bottom: 6px;
  padding: 2px 0;
}
/* AI 导购点评：像懂车帝/小红书买手一样给结构化选购建议，置于商品卡上方 */
.ai-advice {
  background: linear-gradient(135deg, #fff7e6 0%, #fff1f0 100%);
  border: 1px solid #ffd591;
  border-radius: 12px;
  padding: 10px 12px;
  margin: 0 0 10px;
  font-size: 13px;
  line-height: 1.65;
  color: #614a14;
}
.ai-advice-title {
  font-weight: 700;
  font-size: 13px;
  color: #d4380d;
  margin-bottom: 4px;
}
.ai-advice-line {
  margin: 2px 0;
}
.ai-advice-line b { color: #ad4e00; }
.ai-advice-conclusion b { color: #cf1322; }
.ai-advice-warn { color: #ad6800; }
.ai-advice-warn b { color: #ad6800; }
[data-theme="dark"] .ai-advice {
  background: linear-gradient(135deg, #2a2418 0%, #2a1f1d 100%);
  border-color: #5c4a2e;
  color: #e8d9b5;
}
[data-theme="dark"] .ai-advice-title { color: #ffa940; }
[data-theme="dark"] .ai-advice-line b,
[data-theme="dark"] .ai-advice-conclusion b { color: #ffc069; }
[data-theme="dark"] .ai-advice-warn { color: #ffd666; }
.ai-product-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 4px;
}
.ai-product-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #fff;
  border: 1px solid #f0f0f0;
  border-radius: 10px;
  padding: 10px;
  text-decoration: none !important;
  color: #333 !important;
  box-sizing: border-box;
  overflow: hidden;
  transition: all .2s;
}
.ai-product-item:hover {
  border-color: #ff2e54;
  box-shadow: 0 2px 8px rgba(255,46,84,.1);
}
.ai-product-pic {
  width: 60px;
  height: 60px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
  display: block;
  background: #f5f5f5;
  align-self: flex-start;
}
.ai-product-info {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}
.ai-product-title {
  font-size: 13px;
  font-weight: 500;
  color: #333;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  margin: 0 0 3px;
}
.ai-product-desc {
  font-size: 11px;
  color: #999;
  margin-bottom: 2px;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ai-product-price {
  font-size: 12px;
  color: #ff2e54;
}
.ai-product-price b {
  font-size: 15px;
}
.ai-coupon {
  display: inline-block;
  background: #fff1f0;
  color: #ff2e54;
  border: 1px solid #ffccc7;
  border-radius: 4px;
  font-size: 10px;
  padding: 0 4px;
  margin-left: 4px;
}
.ai-sales {
  color: #999;
  font-size: 11px;
  margin-left: 4px;
}
.ai-product-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}
.ai-tag {
  display: inline-block;
  background: #f6ffed;
  color: #389e0d;
  border: 1px solid #b7eb8f;
  border-radius: 4px;
  font-size: 10px;
  padding: 1px 5px;
  line-height: 1.5;
}
[data-theme="dark"] .ai-tag {
  background: #162312;
  color: #95de64;
  border-color: #274916;
}
.ai-product-date {
  font-size: 10px;
  color: #bbb;
}
.ai-product-badge {
  align-self: center;
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 500;
  color: #ff2e54;
  background: #fff0f3;
  border: 1px solid #ffccc7;
  white-space: nowrap;
  border-radius: 14px;
  padding: 5px 10px;
}
.ai-product-footer {
  font-size: 12px;
  color: #999;
  margin-top: 6px;
  line-height: 1.5;
}

/* ---------- 输入区域 ---------- */
.ai-chat-footer {
  border-top: 1px solid #eee;
  padding: 10px 14px;
  background: #fff;
  flex-shrink: 0;
}
.ai-input-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.ai-input-area {
  flex: 1;
  position: relative;
}
.ai-input-area textarea {
  width: 100%;
  border: 1px solid #e0e0e0;
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 13px;
  line-height: 1.5;
  resize: none;
  outline: none;
  max-height: 80px;
  transition: border-color .2s;
  background: #f8f9fa;
  font-family: inherit;
}
.ai-input-area textarea:focus {
  border-color: #ff2e54;
  background: #fff;
}
.ai-send-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #ff2e54;
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 16px;
  flex-shrink: 0;
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ai-send-btn:hover {
  background: #e0284a;
  transform: scale(1.05);
}
.ai-send-btn:disabled {
  background: #ccc;
  cursor: not-allowed;
  transform: none;
}
.ai-chat-footer-tip {
  text-align: center;
  font-size: 10px;
  color: #bbb;
  margin-top: 6px;
}
/* 快捷指令条：让用户一眼看到 # / @ / ? 用法 */
.ai-shortcuts {
  display: flex;
  gap: 6px;
  margin-bottom: 7px;
  flex-wrap: wrap;
}
.ai-sc-item {
  font-size: 11px;
  color: #ff2e54;
  background: #fff0f3;
  border: 1px solid #ffd6de;
  border-radius: 12px;
  padding: 2px 9px;
  cursor: pointer;
  user-select: none;
  transition: all .15s;
}
.ai-sc-item:hover {
  background: #ff2e54;
  color: #fff;
}
.ai-sc-item b {
  font-weight: 700;
  margin-right: 1px;
}
[data-theme="dark"] .ai-sc-item {
  background: #2a1d22;
  border-color: #5c3038;
  color: #ff8aa0;
}
[data-theme="dark"] .ai-sc-item:hover {
  background: #ff2e54;
  color: #fff;
}

/* 打字指示器 */
.ai-typing {
  display: flex;
  gap: 4px;
  padding: 4px 0;
}
.ai-typing span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #bbb;
  animation: ai-typing-bounce 1.4s infinite ease-in-out;
}
.ai-typing span:nth-child(1) { animation-delay: 0s; }
.ai-typing span:nth-child(2) { animation-delay: .2s; }
.ai-typing span:nth-child(3) { animation-delay: .4s; }
@keyframes ai-typing-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ========== AI选品筛选面板 ========== */
.ai-pick-btn {
  display: inline-block;
  margin-top: 10px;
  margin-left: 12px;
  font-size: 12px;
  color: #ff2e54;
  cursor: pointer;
  user-select: none;
  transition: all .2s;
  font-weight: 500;
}
.ai-pick-btn:hover {
  color: #e0284a;
  transform: scale(1.05);
}
.ai-pick-btn.active {
  color: #e0284a;
  font-weight: 600;
}

.ai-pick-panel {
  display: none;
  margin-top: 14px;
  background: #fff;
  border: 1px solid #ffe0e5;
  border-radius: 14px;
  padding: 14px;
  animation: ai-pick-in .3s ease;
}
.ai-pick-panel.open {
  display: block;
}
.ai-pick-search {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.ai-pick-search input {
  flex: 1;
  border: 1px solid #eee;
  background: #fafafa;
  border-radius: 18px;
  padding: 8px 14px;
  font-size: 12px;
  color: #333;
  outline: none;
  transition: all .2s;
}
.ai-pick-search input:focus {
  border-color: #ff2e54;
  background: #fff;
  box-shadow: 0 0 0 2px rgba(255,46,84,.12);
}
.ai-pick-search button {
  flex-shrink: 0;
  border: none;
  background: linear-gradient(135deg, #ff2e54, #ff6b81);
  color: #fff;
  border-radius: 18px;
  padding: 0 16px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.ai-pick-search button:hover {
  box-shadow: 0 3px 10px rgba(255,46,84,.3);
}
.ai-pick-search button:active {
  transform: scale(.96);
}
@keyframes ai-pick-in {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.ai-pick-section {
  margin-bottom: 12px;
}
.ai-pick-section:last-child {
  margin-bottom: 6px;
}
/* 筛选区默认隐藏，选了品类后才显示 */
.ai-pick-section.filter-hidden {
  display: none;
}
.ai-pick-section.filter-show {
  display: block;
  animation: ai-filter-in .35s ease;
}
@keyframes ai-filter-in {
  from { opacity: 0; max-height: 0; overflow: hidden; }
  to   { opacity: 1; max-height: 300px; overflow: hidden; }
}
/* 品类区始终可见 */
.ai-pick-section.category-section {
  margin-bottom: 10px;
}
/* 已选面包屑 */
.ai-pick-breadcrumb {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
  align-items: center;
}
.ai-pick-breadcrumb .ai-pick-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #fff5f7;
  border: 1px solid #ff2e54;
  border-radius: 14px;
  padding: 3px 10px;
  font-size: 11px;
  color: #ff2e54;
  font-weight: 500;
}
.ai-pick-breadcrumb .ai-pick-chip .ai-chip-close {
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
  opacity: .7;
  margin-left: 2px;
}
.ai-pick-breadcrumb .ai-pick-chip .ai-chip-close:hover {
  opacity: 1;
}
.ai-pick-divider {
  width: 100%;
  height: 1px;
  background: #f0f0f0;
  margin: 8px 0 12px;
}
.ai-pick-section-title {
  font-size: 11px;
  color: #999;
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.ai-pick-section-title .ai-pick-icon {
  font-size: 13px;
}
.ai-pick-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.ai-pick-tag {
  background: #f8f9fa;
  border: 1px solid #eee;
  border-radius: 14px;
  padding: 4px 12px;
  font-size: 11px;
  color: #666;
  cursor: pointer;
  transition: all .2s;
  user-select: none;
  white-space: nowrap;
}
.ai-pick-tag:hover {
  border-color: #ff6b81;
  color: #ff2e54;
  background: #fff5f5;
}
.ai-pick-tag.selected {
  background: #fff5f7;
  color: #ff2e54;
  border-color: #ff2e54;
  box-shadow: 0 0 0 2px rgba(255,46,84,.18);
  font-weight: 600;
}

.ai-pick-submit-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.ai-pick-submit {
  flex: 1;
  padding: 9px 0;
  border-radius: 20px;
  background: linear-gradient(135deg, #ff2e54, #ff6b81);
  color: #fff;
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: 1px;
}
.ai-pick-submit:hover {
  box-shadow: 0 4px 12px rgba(255,46,84,.3);
  transform: translateY(-1px);
}
.ai-pick-submit:disabled {
  background: #ddd;
  color: #aaa;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}
.ai-pick-reset {
  padding: 9px 16px;
  border-radius: 20px;
  background: #fff;
  color: #999;
  border: 1px solid #eee;
  font-size: 12px;
  cursor: pointer;
  transition: all .2s;
}
.ai-pick-reset:hover {
  border-color: #ccc;
  color: #666;
}

.ai-pick-preview {
  font-size: 11px;
  color: #aaa;
  margin-top: 8px;
  text-align: center;
  min-height: 16px;
  line-height: 1.5;
}
.ai-pick-preview strong {
  color: #ff2e54;
}

/* 加载中状态 */
.ai-pick-panel.loading .ai-pick-tags {
  position: relative;
  min-height: 30px;
}
.ai-pick-panel.loading .ai-pick-tags::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 20px;
  height: 20px;
  border: 2px solid #eee;
  border-top-color: #ff2e54;
  border-radius: 50%;
  animation: ai-pick-spin .6s linear infinite;
}
@keyframes ai-pick-spin {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}
.ai-pick-panel.loading .ai-pick-tag {
  opacity: .5;

</style>

    </div>
    <div class="ai-chat-footer-tip">ZhiCms可能会犯错，请理性参考建议哟~</div>
  </div>

<script>
(function() {
  // API_BASE 需以 '/' 结尾，后续拼接 chat / getHistory 等 action；
  // 真实控制器类名 AiAssistantController，框架按“段名+Controller”解析且不区分大小写，故路由段用 index/aiAssistant 即可
  var API_BASE = '{url($route="index/aiAssistant/index", $params=array())}'.replace(/\/index$/, '/');
  var isOpen = false;
  var isLoading = false;
  var chatBody, inputEl, sendBtn, panel, btn, welcome, dot;

  // DOM 元素
  function initDom() {
    chatBody = document.getElementById('aiChatBody');
    inputEl  = document.getElementById('aiInput');
    sendBtn  = document.getElementById('aiSendBtn');
    panel    = document.getElementById('aiChatPanel');
    btn      = document.getElementById('aiAssistantBtn');
    welcome  = document.getElementById('aiWelcome');
    dot      = document.getElementById('aiDot');
  }

  // 打开/关闭面板
  function togglePanel() {
    isOpen = !isOpen;
    if (isOpen) {
      panel.classList.add('open');
      btn.classList.remove('breathing');
      dot.classList.remove('show');
      // 每次打开面板自动换一组热门问题
      rotateQuickWords();
      setTimeout(function() { inputEl.focus(); }, 300);
    } else {
      panel.classList.remove('open');
      btn.classList.add('breathing');
      // 关闭选品面板，恢复快捷词
      if (pickOpen) {
        togglePickPanel();
      }
    }
  }

  // 加载历史消息 + 同步登录态身份
  function loadHistory() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API_BASE + 'getHistory', true);
    xhr.onload = function() {
      try {
        var res = JSON.parse(xhr.responseText);
        updateIdentity(res);
        if (res.history && res.history.length > 0) {
          renderHistory(res.history);
        } else if (!(res && res.is_login)) {
          // 游客态：后端无历史时，从本机 localStorage 恢复，兑现"仅存本机"
          loadLocalHistory();
        }
      } catch(e) {}
    };
    xhr.send();
  }

  // 设置面板头部身份状态条（方案A：当前对话身份；方案B：登录用户维度历史）
  function updateIdentity(res) {
    var el = document.getElementById('aiChatIdentity');
    if (!el) return;
    var isLogin = !!(res && res.is_login);
    var name = (res && res.user_name) ? res.user_name : '游客';
    el.className = 'ai-chat-identity' + (isLogin ? ' login' : '');
    if (isLogin) {
      el.innerHTML = '<span class="ai-id-dot"></span>已登录 · 与「' + name + '」的对话';
    } else {
      el.innerHTML = '<span class="ai-id-dot"></span>游客模式 · 对话仅存于本机';
    }
  }

  // 渲染历史消息
  function renderHistory(history) {
    if (welcome) welcome.style.display = 'none';
    for (var i = 0; i < history.length; i++) {
      appendMessage(history[i].role, history[i].content, false);
    }
    scrollBottom();
  }

  // 添加消息到界面
  function appendMessage(role, content, animate) {
    if (welcome && welcome.style.display !== 'none') {
      welcome.style.display = 'none';
    }

    var msgDiv = document.createElement('div');
    msgDiv.className = 'ai-msg ' + role;

    var avatar = document.createElement('div');
    avatar.className = 'ai-msg-avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    var bubble = document.createElement('div');
    bubble.className = 'ai-msg-bubble';
    bubble.innerHTML = formatContent(content);

    // 引导按钮（产品本身 / 配件周边）点击 -> 直接发送对应意图消息
    var guideBtns = bubble.querySelectorAll('.ai-guide-btn');
    for (var gi = 0; gi < guideBtns.length; gi++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          var m = btn.getAttribute('data-msg');
          if (m) sendMessage(m);
        });
      })(guideBtns[gi]);
    }
    // 模糊需求澄清按钮（预算 / 用途）点击 -> 携带约束重新触发精准搜索
    var clarifyBtns = bubble.querySelectorAll('.ai-clarify-btn');
    for (var ci = 0; ci < clarifyBtns.length; ci++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          var m = btn.getAttribute('data-msg');
          if (m) sendMessage(m);
        });
      })(clarifyBtns[ci]);
    }

    msgDiv.appendChild(avatar);
    msgDiv.appendChild(bubble);
    // 消息操作条：assistant 可复制；user 可重发（提升可用性）
    var actions = document.createElement('div');
    actions.className = 'ai-msg-actions';
    if (role === 'assistant') {
      var copyBtn = document.createElement('span');
      copyBtn.className = 'ai-msg-action';
      copyBtn.textContent = '📋 复制';
      copyBtn.addEventListener('click', function() {
        copyText(stripHtml(bubble.innerHTML));
        copyBtn.textContent = '✅ 已复制';
        setTimeout(function(){ copyBtn.textContent = '📋 复制'; }, 1500);
      });
      actions.appendChild(copyBtn);
    } else {
      var resendBtn = document.createElement('span');
      resendBtn.className = 'ai-msg-action';
      resendBtn.textContent = '↻ 重发';
      resendBtn.addEventListener('click', function() {
        sendMessage(content);
      });
      actions.appendChild(resendBtn);
    }
    msgDiv.appendChild(actions);

    chatBody.appendChild(msgDiv);
    scrollBottom();
    persistMessage(role, content);
  }

  // ===== 游客态本地持久化（localStorage）：兑现"对话仅存于本机"，刷新不丢 =====
  var STORAGE_KEY = 'zhicms_ai_guest_history';
  var localHistory = [];
  function persistMessage(role, content) {
    try {
      // 仅游客态持久化；商品卡 HTML 转为纯文本摘要，避免存巨大结构
      var el = document.getElementById('aiChatIdentity');
      if (el && el.classList.contains('login')) return; // 已登录不写本地
      // 跳过纯商品卡（避免本地膨胀），但保留导购建议/文字
      var plain = stripHtml(content);
      if (plain.length < 2 && content.indexOf('ai-product') !== -1) return;
      localHistory.push({ role: role, content: plain.length > 600 ? plain.substring(0, 600) : plain });
      if (localHistory.length > 50) localHistory = localHistory.slice(-50);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(localHistory));
    } catch(e) {}
  }
  function loadLocalHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length) {
          for (var i = 0; i < arr.length; i++) {
            appendMessage(arr[i].role, arr[i].content, false);
          }
          return true;
        }
      }
    } catch(e) {}
    return false;
  }
  function clearLocalHistory() {
    try { localStorage.removeItem(STORAGE_KEY); localHistory = []; } catch(e) {}
  }

  // 复制文本到剪贴板（兼容非安全上下文）
  function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
    } catch(e) {}
  }

  // 去除 HTML 标签，提取纯文本（用于复制）
  function stripHtml(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    return (tmp.textContent || tmp.innerText || '').trim();
  }

  // 格式化内容（简单的 markdown 处理）
  function formatContent(text) {
    if (!text) return '';
    // HTML 内容（商品卡片 / 链接）直接放行：商品卡是 <div class="ai-product-...">，
    // 须匹配带属性的 <div （而不仅仅是裸 <div>），否则会被下面转义分支当成纯文本显示。
    if (/<(div|a|span|p|b|strong|br)\b/i.test(text) || /<[a-z]+ /i.test(text)) {
      return text;
    }
    // 换行处理
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>')
      // URL 自动链接（排除已有的 a 标签）
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  }

  // 显示打字动画（带阶段化提示，缓解等待焦虑）
  var phaseTimer = null;
  function showTyping() {
    var div = document.createElement('div');
    div.className = 'ai-msg assistant';
    div.id = 'aiTyping';
    div.innerHTML = '<div class="ai-msg-avatar">🤖</div>'
      + '<div class="ai-msg-bubble"><div class="ai-typing-text" id="aiTypingText">正在理解你的需求…</div>'
      + '<div class="ai-typing"><span></span><span></span><span></span></div></div>';
    chatBody.appendChild(div);
    scrollBottom();
    // 阶段提示：随耗时推进，真实反映"理解→搜索→建议"流程
    var phases = ['正在理解你的需求…', '正在搜索全网优惠…', '正在比价并生成导购建议…'];
    var pi = 0;
    var textEl = document.getElementById('aiTypingText');
    if (phaseTimer) clearInterval(phaseTimer);
    phaseTimer = setInterval(function() {
      pi = Math.min(pi + 1, phases.length - 1);
      if (textEl) textEl.textContent = phases[pi];
    }, 2200);
  }

  // 移除打字动画
  function removeTyping() {
    if (phaseTimer) { clearInterval(phaseTimer); phaseTimer = null; }
    var el = document.getElementById('aiTyping');
    if (el) el.remove();
  }

  // 滚动到底部
  function scrollBottom() {
    setTimeout(function() {
      chatBody.scrollTop = chatBody.scrollHeight;
    }, 50);
  }

  // 发送消息
  function sendMessage(msgOverride) {
    var msg = (typeof msgOverride === 'string') ? msgOverride.trim() : inputEl.value.trim();
    if (!msg || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendMessage('user', msg, true);
    showTyping();

    var xhr = new XMLHttpRequest();
    xhr.open('POST', API_BASE + 'chat', true);
    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.onload = function() {
      removeTyping();
      isLoading = false;
      sendBtn.disabled = false;
      try {
        var res = JSON.parse(xhr.responseText);
        if (res && res.unconfigured) {
          appendMessage('assistant', '😣 AI 助手尚未配置，请联系站长在后台「AI 设置」中添加并启用对话模型~', true);
          return;
        }
        appendMessage('assistant', res.reply || '哎呀，ZhiCms没反应过来😅 再试一次吧~', true);
      } catch(e) {
        appendMessage('assistant', '网络出了点小问题，请稍后再试~', true);
      }
    };
    xhr.onerror = function() {
      removeTyping();
      isLoading = false;
      sendBtn.disabled = false;
      appendMessage('assistant', '网络连接失败，请检查网络后再试~', true);
    };
    xhr.send(JSON.stringify({ message: msg }));
  }

  // 清除历史
  function clearHistory() {
    if (!confirm('确定要清除所有对话记录吗？')) return;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', API_BASE + 'clearHistory', true);
    xhr.send();
    // 清空界面
    var msgs = chatBody.querySelectorAll('.ai-msg');

  // 获取当前选择参数
  function getPickParams() {
    return {
      category: pickSelected.category ? pickSelected.category[0] || '' : '',
      price:    pickSelected.price    ? pickSelected.price[0]    || '' : '',
      brand:    pickSelected.brand    ? pickSelected.brand[0]    || '' : '',
      scene:    pickSelected.scene    ? pickSelected.scene[0]    || '' : '',
      feature:  pickSelected.feature  || []
    };
  }

  // 是否有品类选中
  function hasCategory() {
    return !!(pickSelected.category && pickSelected.category.length > 0);
  }

  // 构建API查询参数
  function buildPickQuery() {
    var p = getPickParams();
    var query = [];
    if (p.category) query.push('category=' + encodeURIComponent(p.category));
    if (p.price)    query.push('price=' + encodeURIComponent(p.price));
    if (p.brand)    query.push('brand=' + encodeURIComponent(p.brand));
    if (p.scene)    query.push('scene=' + encodeURIComponent(p.scene));
    for (var i = 0; i < p.feature.length; i++) {
      query.push('feature[]=' + encodeURIComponent(p.feature[i]));
    }
    return query.join('&');
  }

  // 显示/隐藏筛选区域
  function toggleFilterSections(show) {
    var sections = ['aiPickPriceSection', 'aiPickBrandSection', 'aiPickSceneSection', 'aiPickFeatureSection'];
    var divider = document.getElementById('aiPickDivider');
    for (var i = 0; i < sections.length; i++) {
      var sec = document.getElementById(sections[i]);
      if (!sec) continue;
      if (show) {
        sec.classList.remove('filter-hidden');
        sec.classList.add('filter-show');
      } else {
        sec.classList.remove('filter-show');
        sec.classList.add('filter-hidden');
      }
    }
    if (divider) {
      divider.classList.toggle('filter-hidden', !show);
      divider.classList.toggle('filter-show', show);
    }
  }

    var chips = [];
    var p = getPickParams();
    if (p.category) chips.push({ group: 'category', label: p.category });
    if (p.price)    chips.push({ group: 'price',    label: p.price });
    if (p.brand)    chips.push({ group: 'brand',    label: p.brand });
    if (p.scene)    chips.push({ group: 'scene',    label: p.scene });

      for (var i = 0; i < p.feature.length; i++) {
        chips.push({ group: 'feature', label: p.feature[i] });
      }

    if (chips.length === 0) {
      bc.style.display = 'none';
      bc.innerHTML = '';

    bc.style.display = 'flex';
    var html = '';
    for (var j = 0; j < chips.length; j++) {

  // 渲染筛选标签组
  function renderPickGroups(options) {
    if (!options) return;
    pickOptions = options;

    for (var group in pickGroupMeta) {
      var container = document.getElementById('aiPickTag' + group.charAt(0).toUpperCase() + group.slice(1));
      if (!container) continue;

      var tags = options[group] || [];
      // 保留已选中的值（即使AI没返回也保留显示）
      var existingSelected = pickSelected[group] || [];
      var html = '';
      // 先渲染已选中但AI未返回的项
      for (var s = 0; s < existingSelected.length; s++) {
        var sv = existingSelected[s];
        if (tags.indexOf(sv) === -1) {
          html += '<span class="ai-pick-tag selected" data-val="' + sv.replace(/"/g, '&quot;') + '">' + sv + '</span>';
        }
      }
      // 渲染AI返回的项
      for (var i = 0; i < tags.length; i++) {
        var val = tags[i];
        if (existingSelected.indexOf(val) > -1) continue; // 上面已经渲染了
        html += '<span class="ai-pick-tag" data-val="' + val.replace(/"/g, '&quot;') + '">' + val + '</span>';
      }
      container.innerHTML = html || '<span class="ai-pick-empty">— 无 —</span>';
    }

    // 品类区域始终是 category 行，选了品类后才展示筛选区
    toggleFilterSections(hasCategory());

  // 网络层完全失败时的 JS 兜底（按当前已选关键词生成通用联动维度）
  function buildGenericFallback(kw) {
    kw = kw || '该商品';
    return {
      category: ['全部' + kw, kw + '配件', '其他' + kw, '热门' + kw],
      price:    ['100元以下', '100-300元', '300-800元', '800-2000元', '2000元以上'],
      brand:    ['国货优选', '国际大牌', '高性价比', '网红推荐', '专业品牌'],
      scene:    ['日常自用', '送礼', '旅行携带', '办公使用', '囤货'],
      feature:  ['热销爆款', '好评如潮', '新品上市', '限时优惠', '正品保障']
    };
  }

  // 从API获取联动建议
  function fetchPickSuggestions() {
    setPickLoading(true);
    var query = buildPickQuery();
    var url = API_BASE + 'getFilterSuggestions' + (query ? '?' + query : '');

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 8000;
    xhr.onload = function() {
      setPickLoading(false);
      try {
        var res = JSON.parse(xhr.responseText);
        if (res.groups && Object.keys(res.groups).length > 0) {
          renderPickGroups(res.groups);
        } else if (!hasCategory()) {
          // AI不可用时，初始状态退回兜底大品类，保证面板有内容
          renderPickGroups({ category: pickFallbackCategories });
        } else {
          // 已选品类但后端未返回 → JS 兜底，保证筛选区不为空
          renderPickGroups(buildGenericFallback(getPickParams().category || ''));
        }
      } catch(e) {
        // 解析失败：已选品类用 JS 兜底，否则用兜底大品类
        if (hasCategory()) {
          renderPickGroups(buildGenericFallback(getPickParams().category || ''));
        } else {
          renderPickGroups({ category: pickFallbackCategories });
        }
      }
    };
    xhr.onerror = function() {
      setPickLoading(false);
      // 网络层失败：有品类用通用兜底，无品类用大品类入口
      if (hasCategory()) {
        renderPickGroups(buildGenericFallback(getPickParams().category || ''));
      } else {
        renderPickGroups({ category: pickFallbackCategories });
      }
    };
    xhr.ontimeout = function() {
      setPickLoading(false);
      if (hasCategory()) {
        renderPickGroups(buildGenericFallback(getPickParams().category || ''));
      } else {
        renderPickGroups({ category: pickFallbackCategories });
      }
    };
    xhr.send();
  }

  // 点击标签切换选中
  function handlePickTag(e) {
    var tag = e.target;
    if (!tag.classList.contains('ai-pick-tag') || pickLoading) return;

    var container = tag.parentElement;
    if (!container) return;
    var group = container.getAttribute('data-group');
    var val = tag.getAttribute('data-val');
    if (!group || !val) return;

    if (!pickSelected[group]) pickSelected[group] = [];

    var idx = pickSelected[group].indexOf(val);
    if (idx > -1) {
      // 取消选中
      pickSelected[group].splice(idx, 1);
      // 如果取消的是品类，清空后续筛选
      if (group === 'category') {
        pickSelected.price = [];
        pickSelected.brand = [];
        pickSelected.scene = [];
        pickSelected.feature = [];
        toggleFilterSections(false);
      }
    } else {
      // 单选：清空同组
      if (group !== 'feature') {
        pickSelected[group] = [];
      }
      pickSelected[group].push(val);

      // 选了新品类 → 清空后续筛选（AI会重新给）
      if (group === 'category') {
        pickSelected.price = [];
        pickSelected.brand = [];
        pickSelected.scene = [];
        pickSelected.feature = [];
        // 品类变更=重新开始，筛选区暂时隐藏等AI返回后展开
        toggleFilterSections(false);
      }
    }

    updatePickState();
    updateBreadcrumb();
    fetchPickSuggestions();

    var submitBtn = document.getElementById('aiPickSubmit');

    for (var k in pickSelected) {
      if (pickSelected[k] && pickSelected[k].length > 0) { hasAny = true; break; }

      if (p.scene)    parts.push(p.scene);
      if (p.feature && p.feature.length > 0) parts.push(p.feature.join('、'));

      previewEl.innerHTML = '';

  function submitPick() {
    var submitBtn = document.getElementById('aiPickSubmit');
    if (submitBtn && submitBtn.disabled) return;

    var p = getPickParams();
    // 真正要搜的词：用户输入的商品词优先，其次才用品类
    var keyword = pickKeyword || p.category || '';
    if (!keyword) return;

    // 组装回显条件
    var crit = [];
    if (p.category && p.category !== keyword) crit.push('品类' + p.category);
    if (p.price)    crit.push('预算' + p.price);
    if (p.brand)    crit.push('偏好' + p.brand);
    if (p.scene)    crit.push(p.scene);
    if (p.feature && p.feature.length > 0) crit.push('要求' + p.feature.join('、'));

    var userMsg = '帮我找：' + keyword + (crit.length ? '（' + crit.join('，') + '）' : '');
    appendMessage('user', userMsg, true);

    togglePickPanel();
    doPickSearch(keyword, p);

  // 调用选品专用搜索接口（按商品词 + 预算等真实过滤）
  function doPickSearch(keyword, p) {
    showTyping();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', API_BASE + 'pickProductSearch', true);
    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
    xhr.onload = function() {
      removeTyping();
      try {
        var res = JSON.parse(xhr.responseText);
        var html = (res && res.html) ? res.html : '抱歉，没找到相关商品，换个关键词试试~';
        appendMessage('assistant', html, true);
      } catch(e) {
        appendMessage('assistant', '网络出了点小问题，请稍后再试~', true);
      }
    };
    xhr.onerror = function() {
      removeTyping();
      appendMessage('assistant', '网络连接失败，请检查网络后再试~', true);
    };
    xhr.send(JSON.stringify({
      keyword: keyword,
      category: p.category,
      price: p.price,
      brand: p.brand,
      scene: p.scene,
      feature: p.feature
    }));
  }

  // 重置所有筛选
  function resetPick() {
    pickSelected = {};
    pickKeyword = '';
    toggleFilterSections(false);
    updatePickState();
    updateBreadcrumb();
    fetchPickSuggestions();
  }

  // 初始化事件
  function bindEvents() {
    // 悬浮按钮
    btn.addEventListener('click', togglePanel);

    // 关闭按钮
    document.getElementById('aiCloseBtn').addEventListener('click', togglePanel);

    // 清除按钮
    document.getElementById('aiClearBtn').addEventListener('click', clearHistory);

    // 发送按钮
    sendBtn.addEventListener('click', sendMessage);

    // 换一批快捷词
    document.getElementById('aiQuickRefresh').addEventListener('click', rotateQuickWords);

    // AI选品按钮
    document.getElementById('aiPickBtn').addEventListener('click', togglePickPanel);

    // 选品面板标签点击（事件代理）
    document.getElementById('aiPickPanel').addEventListener('click', function(e) {
      if (e.target.classList.contains('ai-pick-tag')) {
        handlePickTag(e);
        return;
      }
      // 面包屑芯片关闭按钮
      if (e.target.closest('.ai-chip-close')) {
        handleChipClick(e);
        return;
      }
    });

    // 选品提交
    document.getElementById('aiPickSubmit').addEventListener('click', submitPick);

    // 选品重置
    document.getElementById('aiPickReset').addEventListener('click', resetPick);

    // 关键词搜索框
    var pickSearchInput = document.getElementById('aiPickSearch');
    var pickSearchBtn = document.getElementById('aiPickSearchBtn');
    if (pickSearchInput && pickSearchBtn) {
      pickSearchBtn.addEventListener('click', submitPickSearch);
      pickSearchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitPickSearch();
        }
      });
    }

    // 输入框回车发送
    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 快捷指令：点击 # / @ / ? 自动在输入框前加前缀，引导用户使用直搜/比价/问答
    var scItems = document.querySelectorAll('.ai-sc-item');
    for (var si = 0; si < scItems.length; si++) {
      scItems[si].addEventListener('click', function() {
        var p = this.getAttribute('data-prefix');
        var cur = inputEl.value.trim();
        // 若已以某前缀开头则替换，避免重复前缀
        cur = cur.replace(/^[#@?]\s*/, '');
        inputEl.value = p + cur;
        inputEl.focus();
        autoResize();
      });
    }

    // 自动调整高度
    inputEl.addEventListener('input', autoResize);

    // 点击面板外部不关闭（因为是悬浮面板，保留该行为）
    // ESC 关闭面板
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && isOpen) {
        togglePanel();
      }
    });
  }

  // 启动
  function init() {
    initDom();
    bindEvents();
    renderQuickWords();
    loadHistory();
    // 异步拉取最新热词（不阻塞渲染）
    fetchHotKeywords();
  }

  // DOM 加载完成后初始化
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
