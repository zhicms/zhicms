<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>{if isset($view) && $view['title']}{$view['title']} - {obj('base/Base')->SiteConfig('sitename')}{else}{obj('base/Base')->SEO('index_title')}{/if}</title>
<meta name="keywords" content="{obj('base/Base')->SEO('index_keywords')}">
<meta name="description" content="{obj('base/Base')->SEO('index_dec')}">
<link rel="icon" href="{obj('base/Base')->SiteConfig('hosturl')}favicon.ico">
<link rel="stylesheet" href="{__PUBLIC__}web/css/blog.css">
<script src="{__PUBLIC__}web/js/jquery-1.9.1.0720.min.js"></script>
<script>
/* 防闪烁：渲染前确定主题，优先级 localStorage > 系统偏好 */
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body>
<nav class="blog-header">
  <div class="blog-header-c container">
    <a class="blog-brand" href="{url($route='index/index/index', $params=array())}" title="{obj('base/Base')->SiteConfig('sitename')}">
      {if obj('base/Base')->SiteConfig('logo')}
      <img src="{obj('base/Base')->SiteConfig('logo')}" alt="{obj('base/Base')->SiteConfig('sitename')}">
      {else}
      <span class="blog-brand-text">
        <span class="blog-header-title">{obj('base/Base')->SiteConfig('sitename')}</span>
        <span class="blog-header-subtitle">{obj('base/Base')->SEO('about')}</span>
      </span>
      {/if}
    </a>

    <div class="blog-header-toggle" id="blogNavToggle" aria-label="菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </div>

    <div class="blog-header-nav" id="blogNav">
      <ul class="nav-list">
        <li><a class="nav-link {if CONTROLLER_NAME=='index' && ACTION_NAME=='index' && !isset($_GET['list']) && !isset($_GET['id'])}active{/if}" href="{url($route='index/index/index', $params=array())}">首页</a></li>
        <li><a class="nav-link {if CONTROLLER_NAME=='brand'}active{/if}" href="{url($route='index/brand/index', $params=array())}">大牌</a></li>
        <li><a class="nav-link {if CONTROLLER_NAME=='cheaps'}active{/if}" href="{url($route='index/cheaps/index', $params=array())}">优惠券</a></li>
        <li><a class="nav-link {if CONTROLLER_NAME=='rank'}active{/if}" href="{url($route='index/rank/index', $params=array())}">风云榜</a></li>
        <li><a class="nav-link {if CONTROLLER_NAME=='hot'}active{/if}" href="{url($route='index/hot/index', $params=array())}">热榜</a></li>
        <li><a class="nav-link {if CONTROLLER_NAME=='forum'}active{/if}" href="{url($route='index/forum/index', $params=array())}">社区</a></li>
        <li><a class="nav-link {if CONTROLLER_NAME=='page'}active{/if}" href="{url($route='index/page/app', $params=array())}">APP</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="nav-overlay" id="blogNavOverlay"></div>

<main class="container blog-container">
