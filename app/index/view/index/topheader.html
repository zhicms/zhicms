<script>
/* 防闪烁：在渲染前确定主题，优先级 localStorage > 系统偏好 */
(function () {
  try {
    var t = localStorage.getItem('smz_theme');
    if (!t || (t !== 'dark' && t !== 'light' && t !== 'system')) {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  } catch (e) {}
})();
</script>

  <script src="{__PUBLIC__}vendor/vue.global.prod.js"></script>
  <script>
  (function () {
    if (typeof Vue === 'undefined') return;
    var KEY = 'smz_theme';
    var ThemeSwitch = {
      data: function () { return { open: false, mode: 'system' }; },
      computed: {
        icon: function () { return this.mode === 'dark' ? '☀️' : '🌙'; }
      },
      mounted: function () {
        this.syncMode();
        var self = this;
        this._onDoc = function (e) {
          if (self.open && !(e.target.closest && e.target.closest('#theme-switch'))) self.open = false;
        };
        document.addEventListener('click', this._onDoc);
      },
      beforeUnmount: function () { document.removeEventListener('click', this._onDoc); },
      methods: {
        syncMode: function () {
          var dt = document.documentElement.getAttribute('data-theme');
          this.mode = (dt === 'dark' || dt === 'light') ? dt : 'system';
        },
        toggle: function () { this.open = !this.open; },
        set: function (m) {
          this.mode = m;
          if (m === 'system') document.documentElement.removeAttribute('data-theme');
          else document.documentElement.setAttribute('data-theme', m);
          try { localStorage.setItem(KEY, m); } catch (e) {}
          this.open = false;
        }
      },
      template:
        '<div class="smz-theme-switch">' +
        '  <button type="button" class="smz-theme-toggle" @click="toggle" title="外观模式">' +
        '    <span class="theme-ico" v-text="icon"></span>' +
        '  </button>' +
        '  <transition name="tp">' +
        '    <div class="smz-theme-panel" v-if="open" @click.stop>' +
        '      <div class="tp-title">外观模式</div>' +
        '      <label class="tp-opt" :class="{on: mode===\'light\'}"><input type="radio" name="tp" :checked="mode===\'light\'" @change="set(\'light\')"> 浅色</label>' +
        '      <label class="tp-opt" :class="{on: mode===\'dark\'}"><input type="radio" name="tp" :checked="mode===\'dark\'" @change="set(\'dark\')"> 深色</label>' +
        '      <label class="tp-opt" :class="{on: mode===\'system\'}"><input type="radio" name="tp" :checked="mode===\'system\'" @change="set(\'system\')"> 跟随系统</label>' +
        '    </div>' +
        '  </transition>' +
        '</div>'
    };
    Vue.createApp(ThemeSwitch).mount('#theme-switch');
  })();
  </script>
