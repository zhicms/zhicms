<script>
window.__postConfig = {
    maxChars: <?php echo $mc; ?>,
    maxImages: <?php echo $mi; ?>,
    maxLinks: <?php echo $ml; ?>,
    isLogin: <?php echo !empty($currentUser) ? 'true' : 'false'; ?>
};
window.__postImages = [];
window.__postGoodsData = []; // 多个商品卡片

// 打开/关闭弹窗
function openPostModal() {
    document.getElementById('postMask').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    setTimeout(function() {
        var t = document.getElementById('postContent');
        if (t) t.focus();
    }, 150);
}

function closePostModal() {
    document.getElementById('postMask').style.display = 'none';
    document.body.style.overflow = '';
}

// 点击遮罩关闭
document.getElementById('postMask').addEventListener('click', function(e) {
    if (e.target === this) closePostModal();
});
// ESC 关闭
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        var mask = document.getElementById('postMask');
        if (mask && mask.style.display !== 'none') closePostModal();
    }
});

// 字数计数
document.getElementById('postContent').addEventListener('input', function() {
    var max = window.__postConfig.maxChars;
    var len = Array.from(this.value).length;
    var counter = document.getElementById('charCounter');
    var box = document.getElementById('pmCounterBox');
    counter.textContent = (max - len);
    box.className = 'pm-counter';
    if (len > max * 0.9) box.classList.add('warn');
    if (len >= max) box.classList.add('danger');
});

// 图片上传
document.getElementById('postImageInput').addEventListener('change', function(e) {
    var files = e.target.files;
    if (!files || files.length === 0) return;
    var remaining = window.__postConfig.maxImages - window.__postImages.length;
    if (remaining <= 0) {
        alert('最多上传 ' + window.__postConfig.maxImages + ' 张图片');
        e.target.value = '';
        return;
    }
    var toUpload = Array.from(files).slice(0, remaining);
    toUpload.forEach(function(file) {
        if (!file.type.startsWith('image/')) return;
        if (file.size > 5 * 1024 * 1024) { alert(file.name + ' 超过 5MB'); return; }
        var formData = new FormData();
        formData.append('file', file);
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'index.php?r=index/forum/uploadImage', true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var r = JSON.parse(xhr.responseText);
                        if (r.status === 'y') {
                            window.__postImages.push(r.url);
                            renderPostImages();
                        } else {
                            alert(r.info);
                        }
                    } catch (err) { alert('上传失败'); }
                }
            }
        };
        xhr.send(formData);
    });
    e.target.value = '';
});

function renderPostImages() {
    var box = document.getElementById('postImagesPreview');
    var html = '';
    window.__postImages.forEach(function(url, idx) {
        html += '<div class="img-item"><img src="' + url + '" alt=""><span class="remove" onclick="removePostImage(' + idx + ')">×</span></div>';
    });
    box.innerHTML = html;
    document.getElementById('imageCount').textContent = window.__postImages.length + '/' + window.__postConfig.maxImages;
}

function removePostImage(idx) {
    window.__postImages.splice(idx, 1);
    renderPostImages();
}

// 商品链接解析（支持多个）
document.getElementById('postLinkBtn').addEventListener('click', function() {
    if (window.__postGoodsData.length >= window.__postConfig.maxLinks) {
        alert('最多添加 ' + window.__postConfig.maxLinks + ' 个商品链接');
        return;
    }
    var box = document.getElementById('postLinkBox');
    box.style.display = box.style.display === 'none' ? 'flex' : 'none';
    if (box.style.display === 'flex') {
        document.getElementById('postLinkInput').focus();
    }
});

function parseProductLink() {
    var url = document.getElementById('postLinkInput').value.trim();
    if (!url) { alert('请输入链接'); return; }
    if (window.__postGoodsData.length >= window.__postConfig.maxLinks) {
        alert('最多添加 ' + window.__postConfig.maxLinks + ' 个商品链接');
        return;
    }
    var result = document.getElementById('postLinkResult');
    result.className = 'pm-link-result';
    result.textContent = '解析中...';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=index/forum/parseLink', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {
                try {
                    var r = JSON.parse(xhr.responseText);
                    if (r.status === 'y' && r.card) {
                        window.__postGoodsData.push(r.card);
                        renderGoodsPreview();
                        result.className = 'pm-link-result success';
                        result.textContent = '✓ ' + (r.card.platformName || '商品') + ' 已添加';
                        document.getElementById('postLinkInput').value = '';
                        if (window.__postGoodsData.length >= window.__postConfig.maxLinks) {
                            document.getElementById('postLinkBox').style.display = 'none';
                        }
                        document.getElementById('linkCount').textContent = window.__postGoodsData.length + '/' + window.__postConfig.maxLinks;
                    } else {
                        result.className = 'pm-link-result error';
                        result.textContent = '✗ ' + (r.info || '解析失败');
                    }
                } catch (err) {
                    result.className = 'pm-link-result error';
                    result.textContent = '✗ 响应异常';
                }
            }
        }
    };
    xhr.send('url=' + encodeURIComponent(url));
}

function cancelLinkParse() {
    document.getElementById('postLinkBox').style.display = 'none';
    document.getElementById('postLinkInput').value = '';
    document.getElementById('postLinkResult').textContent = '';
}

function renderGoodsPreview() {
    var box = document.getElementById('postGoodsPreview');
    var html = '';
    window.__postGoodsData.forEach(function(card, idx) {
        var platformName = card.platformName || ({tb:'淘宝', jd:'京东', pdd:'拼多多', vip:'唯品会'}[card.platform] || card.platform);
        html += '<div class="pm-goods-card">';
        if (card.pic) {
            html += '<img class="goods-pic" src="' + card.pic + '" alt="">';
        }
        html += '<div class="goods-info">';
        html += '<div class="goods-title">' + (card.title || '商品') + '</div>';
        html += '<div class="goods-price">';
        html += '<span class="goods-platform">' + platformName + '</span>';
        if (card.actPrice > 0) {
            html += '<span class="act-price">¥' + Number(card.actPrice).toFixed(2) + '</span>';
        }
        if (card.origPrice > 0 && card.origPrice > card.actPrice) {
            html += '<span class="orig-price">¥' + Number(card.origPrice).toFixed(2) + '</span>';
        }
        if (card.coupon > 0) {
            html += '<span class="goods-coupon">券' + card.coupon + '元</span>';
        }
        html += '</div>';
        if (card.sales > 0) {
            html += '<small style="color:#999;font-size:11px;">月销 ' + card.sales + '</small>';
        }
        html += '</div>';
        html += '<span class="goods-remove" onclick="removeGoodsCard(' + idx + ')">×</span>';
        html += '</div>';
    });
    box.innerHTML = html;
}

function removeGoodsCard(idx) {
    window.__postGoodsData.splice(idx, 1);
    renderGoodsPreview();
    document.getElementById('linkCount').textContent = window.__postGoodsData.length + '/' + window.__postConfig.maxLinks;
    // 重新显示链接输入框（如果之前隐藏）
    if (window.__postGoodsData.length < window.__postConfig.maxLinks) {
        document.getElementById('postLinkBox').style.display = 'flex';
    }
}

// 提交发帖
function submitPostForm() {
    var content = document.getElementById('postContent').value.trim();
    if (!content) { alert('请填写内容'); return; }
    var gid = parseInt(document.getElementById('postGid').value) || 0;
    if (gid <= 0) { alert('请选择小组'); return; }

    var poster = '';
    var mail = '';
    if (!window.__postConfig.isLogin) {
        poster = document.getElementById('postPoster').value.trim();
        if (!poster) { alert('请填写昵称'); return; }
        mail = document.getElementById('postMail').value.trim();
    }

    var images = window.__postImages.length > 0 ? JSON.stringify(window.__postImages) : '';
    var goodsData = window.__postGoodsData.length > 0 ? JSON.stringify(window.__postGoodsData) : '';

    var formData = new URLSearchParams();
    formData.append('gid', gid);
    formData.append('content', content);
    if (images) formData.append('images', images);
    if (goodsData) formData.append('goods_data', goodsData);
    if (!window.__postConfig.isLogin) {
        formData.append('poster', poster);
        formData.append('mail', mail);
    }

    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=index/forum/postForum', true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {
                try {
                    var r = JSON.parse(xhr.responseText);
                    if (r.status === 'y') {
                        closePostModal();
                        window.location.href = r.url;
                    } else {
                        alert(r.info);
                    }
                } catch (err) { alert('提交失败'); }
            }
        }
    };
    xhr.send(formData);
}
</script>
