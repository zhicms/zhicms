{include file="app/manage/view/index/emlog_nav"}

<!-- 页面标题 -->
<h1 class="page-title">
    <i class="fas fa-file-alt"></i>
    {$pageText['1']}
</h1>

<!-- 页面表单 -->
<form class="" id="form" action="" method="post">
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-pen"></i> 页面信息
            </div>
            <div class="card-body">
                    <div class="form-group">
                        <label for="title">页面标题</label>
                        <input type="text" class="form-control" name="title" id="title" placeholder="请输入页面标题" value="{$ret['title']}">
                    </div>

                    <div class="form-group">
                        <label for="alias">页面别名 <span class="text-muted small">（用于伪静态访问，如 about 对应 /page-about.html）</span></label>
                        <input type="text" class="form-control" name="alias" id="alias" placeholder="如 about / privacy / help" value="{$ret['alias']}">
                        <small class="form-text text-muted">只能包含字母、数字、下划线、中划线；留空则使用 ID 访问（/page-1.html）。建议为"关于我们""隐私政策"等设置易记别名。</small>
                    </div>

                    <div class="form-group">
                        <label for="keywords">SEO关键词</label>
                        <input type="text" class="form-control" name="keywords" id="keywords" placeholder="关键词，多个用逗号分隔" value="{$ret['keywords']}">
                    </div>

                    <div class="form-group">
                        <label for="dec">页面描述</label>
                        <input type="text" class="form-control" name="dec" id="dec" placeholder="页面的简短描述" value="{$ret['dec']}">
                    </div>

                        <div class="form-group">
                            <label for="body">页面内容</label>
                            <!-- TinyMCE 编辑器容器 -->
                            <textarea id="page-editor" name="body" data-editor data-upload-type="page" data-height="550">{$ret['body']|raw}</textarea>
                            <small class="form-text text-muted">支持富文本编辑，可使用[插入商品链接]功能添加电商产品链接</small>
                        </div>

                    {$html}

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 保存页面
                        </button>
                        <button type="button" class="btn btn-outline-secondary" onclick="window.location.href='index.php?r=manage/page/index'">
                            <i class="fas fa-arrow-left"></i> 返回列表
                        </button>
                    </div>
            </div>
        </div>
    </div>

    <!-- 侧边栏 -->
    <div class="col-lg-4">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-cog"></i> 页面设置
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>发布状态</label>
                    <select class="form-control">
                        <option value="publish">立即发布</option>
                        <option value="draft">保存为草稿</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>显示在菜单</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="menuCheck" checked>
                        <label class="form-check-label" for="menuCheck">
                            在导航菜单中显示
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</form>

{include file="app/manage/view/index/emlog_footer"}

<!-- TinyMCE 编辑器加载 -->
<script src="https://tinymce.vt5.cn/tinymce.min.js"></script>
<script src="/public/manage/js/tinymce-init.js"></script>

<script>
$(function() {
    // 初始化 TinyMCE 编辑器
    if (typeof initZhiCmsEditor === 'function') {
        initZhiCmsEditor('#page-editor', {
            uploadType: 'page',
            height: 550
        });
    }

    // 表单提交前处理
    $('#form').on('submit', function() {
        if (typeof tinymce !== 'undefined') {
            const editor = tinymce.get('page-editor');
            if (editor) {
                // 将商品链接转换回 [ZhiCmsUrl] 标签
                if (typeof convertHtmlToZhiCmsUrlTags === 'function') {
                    convertHtmlToZhiCmsUrlTags(editor);
                }
                // 同步到 textarea
                editor.save();
            }
        }
    });
});
</script>
