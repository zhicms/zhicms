{include file="app/manage/view/index/emlog_nav"}

<!-- 页面标题 -->
<h1 class="page-title">
    <i class="fas fa-file-alt"></i>
    {$pageText['1']}
</h1>

<!-- 页面表单 -->
<form class="" id="form" action="" method="post">
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-pen"></i> 页面信息
            </div>
            <div class="card-body">
                    <div class="form-group">
                        <label for="title">页面标题</label>
                        <input type="text" class="form-control" name="title" id="title" placeholder="请输入页面标题" value="{$ret['title']}">
                    </div>

                    <div class="form-group">
                        <label for="keywords">SEO关键词</label>
                        <input type="text" class="form-control" name="keywords" id="keywords" placeholder="关键词，多个用逗号分隔" value="{$ret['keywords']}">
                    </div>

                    <div class="form-group">
                        <label for="dec">页面描述</label>
                        <input type="text" class="form-control" name="dec" id="dec" placeholder="页面的简短描述" value="{$ret['dec']}">
                    </div>

                        <div class="form-group">
                            <label for="body">页面内容</label>
                            <div id="editor-md-container">
                                <textarea name="body">{$ret['body']}</textarea>
                            </div>
                            <small class="form-text text-muted">支持 Markdown 语法和 HTML，可使用多媒体元素丰富页面内容</small>
                        </div>

                    {$html}

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 保存页面
                        </button>
                        <button type="button" class="btn btn-outline-secondary" onclick="window.location.href='index.php?r=manage/page/index'">
                            <i class="fas fa-arrow-left"></i> 返回列表
                        </button>
                    </div>
            </div>
        </div>
    </div>

    <!-- 侧边栏 -->
    <div class="col-lg-4">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-cog"></i> 页面设置
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>发布状态</label>
                    <select class="form-control">
                        <option value="publish">立即发布</option>
                        <option value="draft">保存为草稿</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>显示在菜单</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="menuCheck" checked>
                        <label class="form-check-label" for="menuCheck">
                            在导航菜单中显示
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</form>

{include file="app/manage/view/index/emlog_footer"}

<!-- Editor.md 本地集成（移植自 emlog 后台，避免 CDN 不可达与样式冲突） -->
<link rel="stylesheet" href="/public/global/editormd/css/editormd.css" />
<script src="/public/global/editormd/editormd.js"></script>

<script>
$(function() {
    var testEditor = editormd("editor-md-container", {
        width: "100%",
        height: 550,
        path: "/public/global/editormd/lib/",
        placeholder: "开始编写页面内容...",
        toolbarIcons: function() {
            return ["bold", "del", "italic", "quote", "|", "h1", "h2", "h3", "|", "list-ul", "list-ol", "hr", "|",
                "link", "image", "code", "code-block", "table", "|", "search", "preview", "fullscreen"]
        },
        watch: false,
        lineNumbers: false,
        htmlDecode: true,
        emoji: true,
        taskList: true,
        tocm: true,
        imageUpload: true,
        imageFormats: ["jpg", "jpeg", "gif", "png", "bmp", "webp"],
        imageUploadURL: "index.php?r=manage/File/editor&type=page",
        theme: "default",
        editorTheme: "default",
        previewTheme: "default",
        saveHTMLToTextarea: true,
        syncScrolling: "single",
        autoFocus: false,
        onload: function() {
            var content = $("textarea[name='body']").val();
            if (content) {
                this.setContent(content);
            }
        },
        onchange: function() {
            this.sync();
        }
    });

    $('#form').on('submit', function() {
        if (testEditor) {
            testEditor.sync();
        }
    });

    // 编辑预览中把 [ZhiCmsUrl]链接[/ZhiCmsUrl] 渲染为可点击的「去购买」链接，
    // 避免预览区显示原始标记文本（前端展示时会自动渲染成站内商品卡片）
    function getPlatformStyle(url) {
        if (/pinduoduo\.com|yangkeduo\.com/i.test(url)) return {color:'#e02e24',text:'去拼多多购买'};
        if (/jd\.com/i.test(url)) return {color:'#e4393c',text:'去京东购买'};
        if (/vip\.com|vipshop\.com/i.test(url)) return {color:'#cd2e6b',text:'去唯品会购买'};
        if (/taobao\.com|tmall\.com/i.test(url)) return {color:'#ff2e54',text:'去淘宝购买'};
        return {color:'#ff5000',text:'去购买'};
    }
    function renderZhiCmsUrlInPreview() {
        var preview = document.querySelector('.editormd-preview');
        if (!preview) return;
        var walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT, null, false);
        var node;
        while (node = walker.nextNode()) {
            var m = node.nodeValue.match(/\[ZhiCmsUrl\]([\s\S]+?)\[\/ZhiCmsUrl\]/);
            if (m) {
                var url = m[1].trim();
                var ps = getPlatformStyle(url);
                var a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.className = 'zhicms-url-preview';
                a.textContent = '🛒 ' + ps.text;
                a.setAttribute('style', 'display:inline-block;margin:8px 0;padding:6px 16px;background:' + ps.color + ';color:#fff;border-radius:20px;text-decoration:none;font-size:13px;');
                var span = document.createElement('span');
                span.appendChild(a);
                node.parentNode.replaceChild(span, node);
            }
        }
    }

    var previewEl = document.querySelector('.editormd-preview');
    if (previewEl && typeof MutationObserver !== 'undefined') {
        var obs = new MutationObserver(renderZhiCmsUrlInPreview);
        obs.observe(previewEl, { childList: true, subtree: true, characterData: true });
        renderZhiCmsUrlInPreview();
    }
});
</script>
