<script>
function searchPage() {
    var keyword = document.getElementById('keyword').value;
    var url = 'index.php?r=manage/page/index';
    if (keyword) {
        url += '&keyword=' + encodeURIComponent(keyword);
    }
    location.href = url;
}

function deletePage(id) {
    if(confirm('确定要删除这个页面吗？此操作不可恢复！')) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'index.php?r=manage/page/del&id=' + id, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                try {
                    var result = JSON.parse(xhr.responseText);
                    if (result.status === 'y') {
                        showToast('页面删除成功', 'success');
                        setTimeout(function() {
                            location.reload();
                        }, 1000);
                    } else {
                        showToast(result.info, 'danger');
                    }
                } catch(e) {
                    showToast('删除失败', 'danger');
                }
            }
        };
        xhr.send();
    }
}

function exportPages() {
    if(confirm('确定要导出页面数据吗？')) {
        // 实现导出功能
        showToast('导出功能开发中...', 'info');
    }
}

function showToast(message, type = 'success') {
    var toast = document.createElement('div');
    toast.className = 'toast align-items-center text-white bg-' + type + ' border-0';
    toast.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 280px;';
    toast.innerHTML = `
        <div class="d-flex">
            <div class="toast-body">
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : 'info-circle'} mr-2"></i>
                ${message}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.parentElement.parentElement.remove()"></button>
        </div>
    `;
    
    document.body.appendChild(toast);
    
    // 自动消失
    setTimeout(function() {
        if(toast.parentNode) {
            toast.parentNode.removeChild(toast);
        }
    }, 3000);
}

// 键盘事件 - 回车搜索
document.getElementById('keyword').addEventListener('keypress', function(e) {
    if(e.which === 13) {
        searchPage();
    }
});
</script>
