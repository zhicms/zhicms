<script>
function recheck() {
    var btn = document.getElementById('recheckBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 检测中...';
    $.get('index.php?r=manage/env/check', function(res) {
        if (res.code === 0 && res.items) {
            renderItems(res.items, res.allPass);
        } else {
            alert('检测失败');
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sync-alt"></i> 重新检测';
    }, 'json').fail(function() {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sync-alt"></i> 重新检测';
        alert('请求失败，请重试');
    });
}

function renderItems(items, allPass) {
    var html = '';
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var levelBadge = it.level === 'required'
            ? '<span class="badge badge-danger ml-1">必须</span>'
            : (it.level === 'recommend' ? '<span class="badge badge-warning ml-1">建议</span>' : '<span class="badge badge-secondary ml-1">可选</span>');
        var status = it.pass
            ? '<span class="text-success"><i class="fas fa-check-circle"></i> ' + escapeHtml(it.current) + '</span>'
            : '<span class="text-danger"><i class="fas fa-times-circle"></i> ' + escapeHtml(it.current) + '</span>';
        var suggest = it.pass ? '<span class="text-success">正常</span>' : nl2br(escapeHtml(it.suggest));
        html += '<tr><td>' + escapeHtml(it.name) + levelBadge + '</td>'
            + '<td>' + status + '</td>'
            + '<td>' + escapeHtml(it.required) + '</td>'
            + '<td class="small text-muted">' + suggest + '</td></tr>';
    }
    document.getElementById('envBody').innerHTML = html;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
}
function nl2br(s) { return s.replace(/\n/g, '<br>'); }
</script>
