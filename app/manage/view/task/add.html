{include file="app/manage/view/index/emlog_nav"}

<h1 class="page-title"><i class="fas fa-plus"></i> 新增计划任务</h1>

<form method="post" action="index.php?r=manage/task/save">
    <div class="card">
        <div class="card-body">
            <div class="form-group">
                <label>任务名称</label>
                <input type="text" class="form-control" name="title" required placeholder="如：每日清理缓存">
            </div>
            <div class="form-group">
                <label>执行方式</label>
                <select class="form-control" name="exec_type" id="exec_type">
                    <option value="url">URL 回调（HTTP 请求该地址）</option>
                    <option value="php">PHP 代码 / 脚本</option>
                    <option value="shell">Shell 命令</option>
                    <option value="python">Python 脚本 / 代码</option>
                </select>
            </div>
            <div class="form-group">
                <label>命令 / 地址 / 代码</label>
                <textarea class="form-control" name="command" rows="5" required placeholder="URL 填完整地址；PHP 填代码或 .php 路径；Shell/Python 填命令或脚本路径"></textarea>
                <small class="text-muted">url：完整 http(s) 地址；php：直接写代码或以 .php 结尾的脚本路径；shell/python：命令或脚本路径（需服务器支持）</small>
            </div>
            <div class="form-group">
                <label>调度周期</label>
                <input type="hidden" name="schedule" id="schedule" value="every 30 minute">
                <div class="form-row align-items-center">
                    <div class="col-auto">
                        <select class="form-control" id="sch_mode">
                            <option value="interval">每隔</option>
                            <option value="daily">每天固定时间</option>
                        </select>
                    </div>
                    <!-- 间隔模式 -->
                    <div class="col-auto" id="box_interval">
                        <input type="number" class="form-control w-90 d-ib" id="iv_num" value="30" min="1">
                        <select class="form-control w-110 d-ib" id="iv_unit">
                            <option value="second">秒</option>
                            <option value="minute" selected>分</option>
                            <option value="hour">时</option>
                            <option value="day">天</option>
                        </select>
                    </div>
                    <!-- 每天固定时间模式 -->
                    <div class="col-auto d-none" id="box_daily">
                        时 <select class="form-control w-75 d-ib" id="daily_h"></select>
                        分 <select class="form-control w-75 d-ib" id="daily_m"></select>
                        秒 <select class="form-control w-75 d-ib" id="daily_s"></select>
                    </div>
                </div>
                <small class="text-muted">间隔模式：每隔 N 秒/分/时/天执行一次；每天固定时间：在每日指定时分秒执行（生成 cron）。当前值：<code id="sch_preview">every 30 minute</code></small>
            </div>
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="status" name="status" value="1" checked>
                <label class="form-check-label" for="status">启用</label>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> 保存任务</button>
    <a href="index.php?r=manage/task/index" class="btn btn-outline-secondary">返回</a>
</form>

{include file="app/manage/view/index/emlog_footer"}

<script>
(function(){
    function pad(n){ return (n<10?'0':'')+n; }
    // 填充时分秒下拉
    for (var h=0; h<24; h++){ var o=document.createElement('option'); o.value=h; o.text=pad(h); document.getElementById('daily_h').appendChild(o); }
    for (var m=0; m<60; m++){ var o1=document.createElement('option'); o1.value=m; o1.text=pad(m); document.getElementById('daily_m').appendChild(o1);
        var o2=document.createElement('option'); o2.value=m; o2.text=pad(m); document.getElementById('daily_s').appendChild(o2); }
    document.getElementById('daily_h').value=2; document.getElementById('daily_m').value=0; document.getElementById('daily_s').value=0;

    function build(){
        var mode = document.getElementById('sch_mode').value;
        var val;
        if (mode==='interval'){
            document.getElementById('box_interval').style.display='';
            document.getElementById('box_daily').style.display='none';
            var n = parseInt(document.getElementById('iv_num').value,10) || 1;
            var u = document.getElementById('iv_unit').value;
            val = 'every ' + n + ' ' + u;
        } else {
            document.getElementById('box_interval').style.display='none';
            document.getElementById('box_daily').style.display='';
            var h=document.getElementById('daily_h').value, m=document.getElementById('daily_m').value, s=document.getElementById('daily_s').value;
            val = s + ' ' + m + ' ' + h + ' * *';
        }
        document.getElementById('schedule').value = val;
        document.getElementById('sch_preview').textContent = val;
    }
    ['sch_mode','iv_num','iv_unit','daily_h','daily_m','daily_s'].forEach(function(id){
        document.getElementById(id).addEventListener('change', build);
        document.getElementById(id).addEventListener('input', build);
    });
    build();
})();
</script>
