    <script>
    $(document).ready(function() {
        // Toggle the side navigation
        $("#sidebarToggle, #sidebarToggleTop").on('click', function(e) {
            $("body").toggleClass("sidebar-toggled");
            $(".sidebar").toggleClass("toggled");
            if ($(".sidebar").hasClass("toggled")) {
                $('.sidebar .collapse').collapse('hide');
            };
        });

        // Close any open menu accordions when window is resized below 768px
        $(window).resize(function() {
            if ($(window).width() < 768) {
                $('.sidebar .collapse').collapse('hide');
            };
        });

        // Prevent the content wrapper from scrolling when the fixed side navigation hovered over
        $('body.fixed-nav .sidebar').on('mousewheel DOMMouseScroll wheel', function(e) {
            if ($(window).width() > 768) {
                var e0 = e.originalEvent,
                    delta = e0.wheelDelta || -e0.detail;
                this.scrollTop += (delta < 0 ? 1 : -1) * 30;
                e.preventDefault();
            }
        });

        // Scroll to top button appear
        $(document).on('scroll', function() {
            var scrollDistance = $(this).scrollTop();
            if (scrollDistance > 100) {
                $('.scroll-to-top').fadeIn();
            } else {
                $('.scroll-to-top').fadeOut();
            }
        });

        // Smooth scrolling using jQuery easing
        $(document).on('click', 'a.scroll-to-top', function(e) {
            var $anchor = $(this);
            $('html, body').stop().animate({
                scrollTop: ($($anchor.attr('href')).offset().top)
            }, 1000, 'swing');
            e.preventDefault();
        });
    });
    </script>

    <!-- 全局弹窗关闭增强：即使 Bootstrap data-api 偶发未绑定，取消/× 也能关闭弹窗 -->
    <script>
    window.zcCloseModal = function(el) {
        var modal = (el && el.closest) ? el.closest('.modal') : null;
        if (!modal) return;
        try {
            if (window.jQuery && jQuery.fn && jQuery.fn.modal) {
                jQuery(modal).modal('hide');
            } else {
                throw new Error('no-bootstrap');
            }
        } catch (e) {
            modal.classList.remove('show');
            modal.style.display = 'none';
            modal.setAttribute('aria-hidden', 'true');
            modal.removeAttribute('aria-modal');
            document.body.classList.remove('modal-open');
            var bd = document.querySelector('.modal-backdrop');
            if (bd && bd.parentNode) bd.parentNode.removeChild(bd);
        }
    };
    document.addEventListener('click', function(e) {
        var closer = e.target.closest && e.target.closest('[data-dismiss="modal"]');
        if (closer) { e.preventDefault(); window.zcCloseModal(closer); }
    }, true);
    </script>

    <!-- 全局 tab 切换兜底：当 Bootstrap data-api 未绑定/失效时（如 CDN 加载失败），仍能切换设置页等 bootstrap tab -->
    <script>
    (function(){
        function ensureTabs(){
            if (window.jQuery && jQuery.fn && jQuery.fn.tab) return; // Bootstrap tab 正常，交给它
            var links = document.querySelectorAll('[data-toggle="tab"]');
            for (var i = 0; i < links.length; i++) {
                (function(link){
                    link.addEventListener('click', function(e){
                        var sel = link.getAttribute('href') || link.getAttribute('data-target');
                        if (!sel) return;
                        var target = document.querySelector(sel);
                        if (!target) return;
                        e.preventDefault();
                        var content = target.closest('.tab-content') || document;
                        var panes = content.querySelectorAll('.tab-pane');
                        for (var j = 0; j < panes.length; j++) panes[j].classList.remove('show', 'active');
                        target.classList.add('show', 'active');
                        var tabList = link.closest('.nav');
                        if (tabList) {
                            var navs = tabList.querySelectorAll('.nav-link');
                            for (var k = 0; k < navs.length; k++) navs[k].classList.remove('active');
                        }
                        link.classList.add('active');
                    });
                })(links[i]);
            }
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ensureTabs);
        else ensureTabs();
    })();
    </script>

    <!-- 全局统一轻提示（后台所有页面共用） -->
    <style>
    .zc-toast-wrap{position:fixed;top:20px;right:20px;z-index:20000;display:flex;flex-direction:column;gap:8px;}
    .zc-toast{min-width:240px;max-width:360px;padding:12px 16px;border-radius:8px;font-size:14px;color:#fff;
      display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);
      opacity:0;transform:translateX(20px);transition:opacity .3s ease,transform .3s ease;}
    .zc-toast.show{opacity:1;transform:translateX(0);}
    .zc-toast.success{background:#2fa76f;}
    .zc-toast.danger{background:#e0284a;}
    .zc-toast .zc-toast-body{flex:1;}
    .zc-toast .zc-toast-close{background:none;border:none;color:rgba(255,255,255,.85);font-size:15px;line-height:1;cursor:pointer;padding:2px;}
    </style>
    <script>
    window.showToast = function(message, type) {
        type = type || 'success';
        var wrap = document.getElementById('zcToastWrap');
        if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'zcToastWrap';
            wrap.className = 'zc-toast-wrap';
            document.body.appendChild(wrap);
        }
        var toast = document.createElement('div');
        toast.className = 'zc-toast ' + type;
        toast.setAttribute('role', 'alert');
        toast.innerHTML = '<span class="zc-toast-body">' + (message || '') + '</span>' +
            '<button type="button" class="zc-toast-close" onclick="this.parentElement.remove()">✕</button>';
        wrap.appendChild(toast);
        requestAnimationFrame(function(){ toast.classList.add('show'); });
        setTimeout(function(){
            toast.classList.remove('show');
            setTimeout(function(){ if(toast.parentNode) toast.parentNode.removeChild(toast); }, 350);
        }, 3000);
    };

    // 全局清除缓存：原生实现，不依赖 layer/ajaxget（避免未引入 layui 时失效）
    window.zcClearCache = function() {
        if (!confirm('确定要清除缓存吗？')) return;
        var url = 'index.php?r=manage/cache/clear&type=all';
        var done = function(ok, msg) {
            if (window.showToast) {
                showToast(msg || (ok ? '缓存已清除' : '清除缓存失败'), ok ? 'success' : 'danger');
            } else {
                alert(msg || (ok ? '缓存已清除' : '清除缓存失败'));
            }
            if (ok) { try { setTimeout(function(){ location.reload(); }, 1200); } catch(e){} }
        };
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        var ok = true, info = '缓存已清除';
                        try {
                            var ret = JSON.parse(xhr.responseText);
                            if (ret && ret.status === 'n') { ok = false; info = ret.info || '清除缓存失败'; }
                            else if (ret && ret.info) { info = ret.info; }
                        } catch (e) {}
                        done(ok, info);
                    } else {
                        done(false, '清除缓存请求失败（HTTP ' + xhr.status + '）');
                    }
                }
            };
            xhr.onerror = function() { done(false, '清除缓存网络错误'); };
            xhr.send();
        } catch (e) {
            done(false, '清除缓存出错：' + e.message);
        }
    };

    // 手动检查更新：绕过 1 小时缓存，强制请求远程升级接口，完成后刷新页面显示最新结果
    window.zcCheckUpdate = function() {
        var btn = document.getElementById('btn-check-update');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 检查中…'; }
        if (window.showToast) showToast('正在检查更新…', 'success');
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'index.php?r=manage/index/checkUpdate&force=1', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var ret = JSON.parse(xhr.responseText);
                            if (ret && ret.status === 'y') {
                                if (window.showToast) showToast('检查完成，页面即将刷新', 'success');
                                setTimeout(function(){ location.reload(); }, 900);
                                return;
                            }
                            var msg = (ret && ret.info) ? ret.info : '检查更新失败';
                            if (window.showToast) showToast(msg, 'danger'); else alert(msg);
                        } catch (e) {
                            if (window.showToast) showToast('返回数据解析失败', 'danger'); else alert('返回数据解析失败');
                        }
                    } else {
                        if (window.showToast) showToast('检查更新请求失败（HTTP ' + xhr.status + '）', 'danger');
                        else alert('检查更新请求失败');
                    }
                    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-cloud-download-alt"></i> 检查更新'; }
                }
            };
            xhr.onerror = function() {
                if (window.showToast) showToast('检查更新网络错误', 'danger'); else alert('检查更新网络错误');
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-cloud-download-alt"></i> 检查更新'; }
            };
            xhr.send();
        } catch (e) {
            if (window.showToast) showToast('检查更新出错：' + e.message, 'danger'); else alert('检查更新出错：' + e.message);
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-cloud-download-alt"></i> 检查更新'; }
        }
    };
    </script>
