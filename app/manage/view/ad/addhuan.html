{include file="app/manage/view/index/emlog_nav"}

<!-- 页面标题 -->
<h1 class="page-title">
    <i class="fas fa-images"></i>
    {$pagetext['1']}
    <a href="index.php?r=manage/ad/huan" class="btn btn-sm btn-outline-secondary float-right">
        <i class="fas fa-arrow-left mr-1"></i>返回列表
    </a>
</h1>

<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-edit"></i> {$pagetext['1']}</h5>
            </div>
            <div class="card-body">
                <form class="layui-form" id="form" action="" method="post">
                    <div class="form-group">
                        <label class="font-weight-bold">标题 <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" placeholder="幻灯广告标题" value="{$ret['title']}">
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">显示平台</label>
                        <select name="type" class="form-control" style="max-width:200px;">
                            <option {if $ret['type']=='0'} selected{/if} value="0">PC网站</option>
                            <option {if $ret['type']=='1'} selected{/if} value="1">移动端</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">封面图片</label>
                        <div class="input-group">
                            <input type="text" name="pic" id="tupian" class="form-control" placeholder="封面图片地址" value="{$ret['pic']}">
                            <div class="input-group-append">
                                <button type="button" class="btn btn-outline-secondary" onclick="upthis()">
                                    <i class="fas fa-upload"></i> 上传
                                </button>
                            </div>
                        </div>
                        <input type="file" name="file" id="up_tupian" onChange="Uploadthis('tupian','up_tupian')" style="display:none">
                        <small class="form-text text-muted">建议尺寸：1900×449</small>
                        {if $ret['pic']}
                        <div class="mt-2">
                            <img src="{$ret['pic']}" class="img-thumbnail" style="max-width:300px;max-height:80px;">
                        </div>
                        {/if}
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">超级链接</label>
                        <input type="text" name="link" class="form-control" placeholder="https:// 或 http:// 开头" value="{$ret['link']}">
                    </div>

                    {$html}

                    <div class="form-group border-top pt-3 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg px-5" id="save">
                            <i class="fas fa-save"></i> 保存
                        </button>
                        <a href="index.php?r=manage/ad/huan" class="btn btn-outline-secondary btn-lg ml-2">
                            <i class="fas fa-times"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{include file="app/manage/view/index/emlog_footer"}

<script src="/public/manage/layer/layer.js"></script>
<script src="/public/manage/js/ajaxfileupload.js"></script>
<script src="/public/manage/js/index.js"></script>
<script>
ZhiForm("#form","index.php?r=manage/ad/huan","保存中","保存","null");

Uploadthis=function(obj,thisid){
    layer.load(2);
    $.ajaxFileUpload({  
        url:'index.php?r=manage/File/huan',  
        secureuri:false,  
        fileElementId:thisid,
        dataType: 'json',
        success: function (data, status) {  
            $("#"+obj).val(data.url);
            layer.closeAll('loading');
        }
    });  	
}

function upthis(){
    document.getElementById("up_tupian").click(); 	
}
</script>
