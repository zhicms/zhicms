﻿{include file="app/manage/view/index/emlog_nav"}

<!-- 页面标题 -->
<h1 class="page-title">
    <i class="fas fa-link"></i>
    {$pagetext['1']}
    <a href="index.php?r=manage/ad/link" class="btn btn-sm btn-outline-secondary float-right">
        <i class="fas fa-arrow-left mr-1"></i>返回列表
    </a>
</h1>

<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-edit"></i> {$pagetext['1']}</h5>
            </div>
            <div class="card-body">
                <form id="form" action="index.php?r=manage/ad/addlink" method="post">
                    <div class="form-group">
                        <label class="font-weight-bold">标题 <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" value="{$ret['title']}" placeholder="链接标题">
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">超级链接 <span class="text-danger">*</span></label>
                        <input type="text" name="link" class="form-control" value="{$ret['link']}" placeholder="https:// 或 http:// 开头">
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">排序</label>
                        <input type="number" name="px" class="form-control mw-200" value="{$ret['px']}" placeholder="数值越小排名越前">
                    </div>

                    {$html}

                    <div class="form-group border-top pt-3 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg px-5" id="save">
                            <i class="fas fa-save"></i> 保存
                        </button>
                        <a href="index.php?r=manage/ad/link" class="btn btn-outline-secondary btn-lg ml-2">
                            <i class="fas fa-times"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{include file="app/manage/view/index/emlog_footer"}

<script>
        jQuery(function($){
            $('#form').on('submit', function(e){
                e.preventDefault();
                var btn = $('#save'), text = btn.html();
                btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 保存中...');
                $.ajax({
                    url: $(this).attr('action'),
                    type: 'POST',
                    data: $(this).serialize(),
                    dataType: 'json',
                    success: function(res){
                        if(res.status == 'y'){
                            showToast(res.info, 'success');
                            setTimeout(function(){ window.location.href = 'index.php?r=manage/ad/link'; }, 1500);
                        } else {
                            showToast(res.info || '保存失败', 'danger');
                            btn.prop('disabled', false).html(text);
                        }
                    },
                    error: function(){
                        showToast('请求异常', 'danger');
                        btn.prop('disabled', false).html(text);
                    }
                });
            });
        });

        function showToast(message, type) {
          type = type || 'success';
          var toast = document.createElement('div');
          toast.className = 'toast align-items-center text-white bg-' + type + ' border-0 position-fixed show';
          toast.setAttribute('role', 'alert');
          toast.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 250px; opacity: 1; transition: opacity .3s ease;';
          var icon = type === 'success' ? 'check-circle' : 'exclamation-circle';
          toast.innerHTML = '<div class="d-flex"><div class="toast-body"><i class="fas fa-' + icon + ' mr-2"></i>' + message + '</div><button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.parentElement.parentElement.remove()"></button></div>';
          document.body.appendChild(toast);
          setTimeout(function() {
            toast.style.opacity = '0';
            setTimeout(function() {
              if(toast.parentNode) toast.parentNode.removeChild(toast);
            }, 350);
          }, 3000);
        }
</script>
