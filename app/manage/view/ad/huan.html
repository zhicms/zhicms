<script>
function del(id) {
    if(confirm('确定要删除这个广告吗？')) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'index.php?r=manage/ad/deletehuan&id=' + id, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                try {
                    var result = JSON.parse(xhr.responseText);
                    if (result.status === 'y') {
                        location.reload();
                    } else {
                        alert(result.info);
                    }
                } catch(e) {
                    location.reload();
                }
            }
        };
        xhr.send();
    }
}
</script>
