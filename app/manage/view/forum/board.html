<script>
function openBoardModal(id, name, px) {
    document.getElementById('boardId').value = id || 0;
    document.getElementById('boardName').value = name || '';
    document.getElementById('boardPx').value = px || 0;
    document.getElementById('boardModalTitle').innerText = id > 0 ? '编辑板块' : '新增板块';
    $('#boardModal').modal('show');
}

function saveBoard() {
    var id = parseInt(document.getElementById('boardId').value) || 0;
    var name = document.getElementById('boardName').value.trim();
    var px = parseInt(document.getElementById('boardPx').value) || 0;
    if (!name) { alert('请填写板块名称'); return; }

    var data = 'id=' + id + '&name=' + encodeURIComponent(name) + '&px=' + px;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=manage/forum/saveBoard', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {
            try {
                var r = JSON.parse(xhr.responseText);
                alert(r.info);
                if (r.status === 'y') {
                    $('#boardModal').modal('hide');
                    location.reload();
                }
            } catch (e) {
                alert('保存失败: ' + xhr.responseText.substring(0, 200));
            }
        }
    };
    xhr.send(data);
}

function delBoard(id) {
    if (!confirm('删除板块后，该板块下的帖子可能会无法分类，确定要删除吗？')) return;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'index.php?r=manage/forum/deleteBoard&id=' + id, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {
            try {
                var r = JSON.parse(xhr.responseText);
                alert(r.info);
                if (r.status === 'y') {
                    var row = document.getElementById('board-row-' + id);
                    if (row) row.style.display = 'none';
                }
            } catch (e) {
                alert('删除失败');
            }
        }
    };
    xhr.send();
}
</script>
