<script>
// 头像上传类型：manageuser
window.ZhiCmsUploadType = 'manageuser';

function upthis() {
    document.getElementById('up_tupian').click();
}

// 头像上传成功后刷新预览并统一弹窗提示
function refreshAvatarPreview(url) {
    if (!url) return;
    document.getElementById('tupian').value = url;
    document.getElementById('picPreview').innerHTML = '<img src="'+url+'" alt="头像" style="width:100%;height:100%;object-fit:cover;">';
}

document.getElementById('up_tupian').addEventListener('change', function(){
    var fileInput = this;
    if (!fileInput.files || !fileInput.files[0]) return;
    var loading = (typeof layer !== 'undefined') ? layer.load(2) : null;
    var type = window.ZhiCmsUploadType || 'manageuser';
    zhicmsUpload(type, 'up_tupian', function(url){
        if (loading !== null) layer.close(loading);
        refreshAvatarPreview(url);
        if (window.showToast) showToast('头像上传成功', 'success');
    });
});

jQuery(function($){
    $('#profile-form').on('submit', function(e){
        e.preventDefault();
        var btn = $('#save'), text = btn.html();
        btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-1"></i> 保存中...');
        $.ajax({
            url: $(this).attr('action'),
            type: 'POST',
            data: $(this).serialize(),
            dataType: 'json',
            success: function(res){
                if(res && res.status == 'y'){
                    showToast(res.info || '保存成功', 'success');
                    setTimeout(function(){ window.location.href = 'index.php?r=manage/index/index'; }, 1500);
                } else {
                    showToast((res && res.info) || '保存失败', 'danger');
                    btn.prop('disabled', false).html(text);
                }
            },
            error: function(){
                showToast('请求异常，请重试', 'danger');
                btn.prop('disabled', false).html(text);
            }
        });
    });
});
</script>
