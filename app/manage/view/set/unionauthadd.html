<div class="auth-form-card">
    <div class="auth-form-title">
        <?php echo $isEdit ? '修改授权' : '新增授权'; ?>
    </div>
    <form id="addForm">

            </div>
        </div>

            <label class="auth-form-label"><span class="req">*</span>选择授权类型：</label>
            <div class="auth-form-ctrl">
                <select class="form-control" name="platform">
                    <?php foreach ($platforms as $k=>$n): ?>
                    <option value="<?php echo $k; ?>" <?php if ($row['platform']===$k) echo 'selected'; ?>><?php echo $n; ?></option>
                    <?php endforeach; ?>
                </select>

        </div>

        <div class="auth-form-row">
            <label class="auth-form-label">免单PID：</label>
            <div class="auth-form-ctrl">

                <div class="auth-form-tip">邵海金免单请填写免单专用PID，其他的不可填写</div>
            </div>
        </div>

            <label class="auth-form-label">app_key：</label>
            <div class="auth-form-ctrl">

            </div>

            <label class="auth-form-label">app_secret：</label>
            <div class="auth-form-ctrl">

            <button type="button" class="btn btn-submit" id="btnSubmit"><i class="fas fa-check"></i> 提交</button>
            <button type="button" class="btn btn-cancel" onclick="location.href='index.php?r=manage/set/unionAuth'">取消</button>
        </div>
    </form>

<script>
$(function(){
    $('#btnSubmit').on('click', function(){
        var data = {};
        $('#addForm').serializeArray().forEach(function(f){ data[f.name] = f.value; });
        if (!data.name || !data.pid) { showToast('名称和 PID 必填'); return; }
        $(this).prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 保存中');
        $.post('index.php?r=manage/set/unionAuthAdd', data, function(res){
            showToast(res.info || '已保存');
            if (res.status === 'y') {
                setTimeout(function(){ location.href = 'index.php?r=manage/set/unionAuth'; }, 600);
            } else {
                $('#btnSubmit').prop('disabled', false).html('<i class="fas fa-check"></i> 提交');
            }
        }, 'json').fail(function(){ showToast('请求异常'); $('#btnSubmit').prop('disabled', false).html('<i class="fas fa-check"></i> 提交'); });
    });
});
</script>
