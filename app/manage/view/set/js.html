            <div class="layui-container" style="max-width:900px;">
                <div class="layui-row">
                    <div class="layui-col-md12">
                        <div class="layui-card">
                            <div class="layui-card-header">
                                <span class="layui-icon layui-icon-message"></span> 统计代码
                            </div>
                            <div class="layui-card-body">
                                <form class="layui-form" id="js-form">
                                    <div class="layui-form-item">
                                        <label class="layui-form-label">网站统计代码</label>
                                        <div class="layui-input-block" style="width:700px;">
                                            <textarea name="tongji" class="layui-textarea" style="min-height:300px;" placeholder="请输入网站统计代码">{$tongji}</textarea>
                                        </div>
                                    </div>
                                    <div class="layui-form-item">
                                        <div class="layui-input-block" style="width:700px;">
                                            <button type="button" class="layui-btn" onclick="submitForm('js')"><i class="layui-icon layui-icon-save"></i> 保存设置</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.staticfile.org/layui/2.9.10/layui.js"></script>
    <script>
        layui.use(['form'], function(){
            var form = layui.form;
            
            window.submitForm = function(type) {
                var form = document.getElementById(type + '-form');
                var data = {};
                var inputs = form.querySelectorAll('input, textarea, select');
                inputs.forEach(function(input) {
                    data[input.name] = input.value;
                });
                
                var url = 'index.php?r=manage/set/' + type;
                
                var xhr = new XMLHttpRequest();
                xhr.open('POST', url, true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                xhr.onreadystatechange = function() {
                    if (xhr.readyState == 4 && xhr.status == 200) {
                        var result = JSON.parse(xhr.responseText);
                        alert(result.info);
                    }
                };
                var params = Object.keys(data).map(function(k) {
                    return encodeURIComponent(k) + '=' + encodeURIComponent(data[k]);
                }).join('&');
                xhr.send(params);
            };
        });
    </script>
</body>
</html>
