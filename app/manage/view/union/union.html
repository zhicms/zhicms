<script>
function del(id) {
    if (confirm('确定删除？')) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'index.php?r=manage/union/deleteUnion&id=' + id, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                var r = JSON.parse(xhr.responseText);
                alert(r.info);
                if (r.status === 'y') location.reload();
            }
        };
        xhr.send();
    }
}
</script>
