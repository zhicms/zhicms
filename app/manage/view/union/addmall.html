<h1 class="page-title"><i class="fas fa-store"></i> <?php echo !empty($this->ret['id']) ? '编辑商城' : '添加商城'; ?></h1>

<form method="post" action="index.php?r=manage/union/<?php echo !empty($this->ret['id']) ? 'editorMall' : 'addMall'; ?>">
    <?php if(!empty($this->ret['id'])): ?><input type="hidden" name="id" value="<?php echo $this->ret['id']; ?>"><?php endif; ?>
    <div class="form-group">
        <label>商城名称</label>
        <input class="form-control" name="name" value="<?php echo $this->ret['name'] ?? ''; ?>">
    </div>
    <div class="form-group">
        <label>所属联盟模型</label>
        <select class="form-control" name="union_id">
            <option value="">请选择</option>
            <?php if(!empty($this->union)): ?>
            <?php foreach($this->union as $u): ?>
            <option value="<?php echo $u['id']; ?>" <?php echo (!empty($this->ret['union_id']) && $this->ret['union_id'] == $u['id']) ? 'selected' : ''; ?>><?php echo $u['name']; ?></option>
            <?php endforeach; ?>
            <?php endif; ?>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="index.php?r=manage/union/mall" class="btn btn-default">返回</a>
</form>
