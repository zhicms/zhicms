<script>
// 初始化排序与折叠 + 拖拽排序
(function() {
    // 折叠按钮
    document.querySelectorAll('.fold-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var id = btn.getAttribute('data-id');
            var children = document.querySelectorAll('#navTbody tr.nav-child[data-parent="'+id+'"]');
            children.forEach(function(tr) { tr.style.display = tr.style.display === 'none' ? '' : 'none'; });
            btn.classList.toggle('fa-chevron-right');
        });
    });
    // 隐藏子导航行，默认折叠
    document.querySelectorAll('#navTbody tr.nav-child').forEach(function(tr) {
        tr.style.display = 'none';
    });

    // HTML5 原生拖拽排序：通过拖拽手柄移动行
    var tbody = document.getElementById('navTbody');
    var dragRow = null;
    tbody.addEventListener('dragstart', function(e) {
        var tr = e.target.closest('tr');
        if (!tr || !tr.querySelector('.drag-handle')) return;
        dragRow = tr;
        tr.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    });
    tbody.addEventListener('dragend', function(e) {
        if (dragRow) { dragRow.classList.remove('dragging'); dragRow = null; }
        e.target.closest('tr') && e.target.closest('tr').classList.remove('drag-over');
    });
    tbody.addEventListener('dragover', function(e) {
        if (!dragRow) return;
        e.preventDefault();
        var target = e.target.closest('tr');
        if (!target || target === dragRow) return;
        // 仅允许同组内拖拽（主导航↔主导航、子导航↔同父级子导航）
        var sameGroup = (dragRow.classList.contains('nav-parent') && target.classList.contains('nav-parent'))
            || (dragRow.classList.contains('nav-child') && target.classList.contains('nav-child') && dragRow.getAttribute('data-parent') === target.getAttribute('data-parent'));
        if (!sameGroup) return;
        var rect = target.getBoundingClientRect();
        var after = (e.clientY - rect.top) > rect.height / 2;
        if (after) target.after(dragRow); else target.before(dragRow);
        target.classList.add('drag-over');
    });
    tbody.addEventListener('drop', function(e) { e.preventDefault(); });
})();

// 保存排序：读取每行排序输入框值（id=值），并自动按行顺序重排 sort
function saveNavSort() {
    var pairs = [];
    var order = 10;
    document.querySelectorAll('#navTbody tr.nav-parent').forEach(function(tr) {
        var id = tr.getAttribute('data-id');
        var input = tr.querySelector('.sort-input');
        var v = input ? parseInt(input.value, 10) : order;
        if (isNaN(v)) v = order;
        pairs.push({ id: id, v: v });
        order += 10;
    });
    if (!pairs.length) { showToast('暂无导航可排序', 'info'); return; }
    var data = [];
    pairs.forEach(function(p) { data.push('sort[' + p.id + ']=' + p.v); });
    // 子导航
    document.querySelectorAll('#navTbody tr.nav-child').forEach(function(tr) {
        var id = tr.getAttribute('data-id');
        var input = tr.querySelector('.sort-input');
        var v = input ? parseInt(input.value, 10) : order;
        if (isNaN(v)) v = order;
        data.push('sort[' + id + ']=' + v);
        order += 10;
    });

    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=manage/nav/sort', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {
            try { var r = JSON.parse(xhr.responseText); showToast(r.info, r.status === 'y' ? 'success' : 'danger'); }
            catch(e){ showToast('保存失败', 'danger'); }
        }
    };
    // 用 JSON 传输 id=>sort 映射，避免 PHP 把数字字符串数组键转成整数导致后端误判格式
    xhr.send('navsort=' + encodeURIComponent(JSON.stringify({
        parent: (function(){ var m = {}; document.querySelectorAll('#navTbody tr.nav-parent').forEach(function(tr){ var i = tr.querySelector('.sort-input'); m[tr.getAttribute('data-id')] = i ? (parseInt(i.value,10)||0) : 0; }); return m; })(),
        child: (function(){ var m = {}; document.querySelectorAll('#navTbody tr.nav-child').forEach(function(tr){ var i = tr.querySelector('.sort-input'); m[tr.getAttribute('data-id')] = i ? (parseInt(i.value,10)||0) : 0; }); return m; })()
    })));
}

// 添加/编辑自定义导航弹窗
function openAddNavModal() {
    document.getElementById('editId').value = 0;
    document.getElementById('nName').value = '';
    document.getElementById('nUrl').value = '';
    document.getElementById('nPid').value = 0;
    document.getElementById('nTarget').checked = false;
    document.getElementById('addNavTitle').textContent = '添加自定义导航';
    openModal('addNavModal');
}

function editNav(id) {
    var tr = document.querySelector('#navTbody tr.nav-parent[data-id="'+id+'"], #navTbody tr.nav-child[data-id="'+id+'"]');
    var name = tr.children[2].textContent.replace(/已隐藏|系统/g,'').trim();
    var urlEl = tr.children[5].querySelector('a');
    var target = tr.children[4].querySelector('.text-success') ? true : false;
    var pid = tr.classList.contains('nav-child') ? tr.getAttribute('data-parent') : 0;
    document.getElementById('editId').value = id;
    document.getElementById('nName').value = name;
    document.getElementById('nUrl').value = urlEl ? urlEl.getAttribute('href') : '';
    document.getElementById('nPid').value = pid;
    document.getElementById('nTarget').checked = target;
    document.getElementById('addNavTitle').textContent = '编辑导航 #' + id;
    openModal('addNavModal');
}

// 保存（新增或编辑）
function saveNav() {
    var id = document.getElementById('editId').value;
    var name = document.getElementById('nName').value.trim();
    var url = document.getElementById('nUrl').value.trim();
    if (!name || !url) { showToast('请填写名称和链接', 'danger'); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=manage/nav/saveOne', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {
            try {
                var r = JSON.parse(xhr.responseText);
                showToast(r.info, r.status === 'y' ? 'success' : 'danger');
                if (r.status === 'y') { closeModal('addNavModal'); setTimeout(function(){ location.reload(); }, 600); }
            } catch(e){ showToast('保存失败', 'danger'); }
        }
    };
    var params = 'id=' + id + '&name=' + encodeURIComponent(name) + '&url=' + encodeURIComponent(url)
        + '&pid=' + document.getElementById('nPid').value + '&target=' + (document.getElementById('nTarget').checked ? 1 : 0);
    xhr.send(params);
}

// 勾选栏目/单页弹窗
function openColumnModal() { openModal('columnModal'); }

function saveColumnAdd() {
    var cols = [], pages = [];
    document.querySelectorAll('.column-check:checked:not(:disabled)').forEach(function(c){ cols.push(c.value); });
    document.querySelectorAll('.page-check:checked:not(:disabled)').forEach(function(c){ pages.push(c.value); });
    var name = document.getElementById('qName').value.trim();
    var url = document.getElementById('qUrl').value.trim();
    if (!cols.length && !pages.length && !name) { showToast('请至少勾选一项或填写自定义导航', 'danger'); return; }
    var params = '';
    cols.forEach(function(c){ params += '&columns[]=' + encodeURIComponent(c); });
    pages.forEach(function(p){ params += '&pages[]=' + encodeURIComponent(p); });
    if (name && url) { params += '&name=' + encodeURIComponent(name) + '&url=' + encodeURIComponent(url); }
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=manage/nav/add', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {
            try {
                var r = JSON.parse(xhr.responseText);
                showToast(r.info, r.status === 'y' ? 'success' : 'danger');
                if (r.status === 'y') { closeModal('columnModal'); setTimeout(function(){ location.reload(); }, 600); }
            } catch(e){ showToast('保存失败', 'danger'); }
        }
    };
    xhr.send(params);
}

// 删除
function delNav(id) {
    if (!confirm('确定删除该导航及其子导航？')) return;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'index.php?r=manage/nav/del&id=' + id, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {
            try { var r = JSON.parse(xhr.responseText); showToast(r.info, r.status === 'y' ? 'success' : 'danger'); if (r.status === 'y') location.reload(); }
            catch(e){ showToast('操作失败', 'danger'); }
        }
    };
    xhr.send();
}

// 显示/隐藏
function toggleHide(id) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'index.php?r=manage/nav/toggle&id=' + id, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {
            try { var r = JSON.parse(xhr.responseText); showToast(r.info, r.status === 'y' ? 'success' : 'danger'); if (r.status === 'y') location.reload(); }
            catch(e){ showToast('操作失败', 'danger'); }
        }
    };
    xhr.send();
}

// 弹窗开关（配合全局 zcCloseModal；先移除 d-none 再设 display，并加 show 让 fade 生效，避免 opacity:0 不可见）
function openModal(id) {
    var m = document.getElementById(id);
    if (m) {
        m.classList.remove('d-none');
        m.classList.add('show');
        m.style.display = 'block';
        addBackdrop(id);
    }
}
function closeModal(id) {
    var m = document.getElementById(id);
    if (m) {
        m.classList.add('d-none');
        m.classList.remove('show');
        m.style.display = 'none';
        removeBackdrop(id);
    }
}
// 弹窗遮罩：点击遮罩关闭弹窗
function addBackdrop(id) {
    if (document.getElementById('bd_' + id)) return;
    var bd = document.createElement('div');
    bd.id = 'bd_' + id;
    bd.className = 'modal-backdrop fade show';
    bd.addEventListener('click', function() { closeModal(id); });
    document.body.appendChild(bd);
}
function removeBackdrop(id) {
    var bd = document.getElementById('bd_' + id);
    if (bd) bd.parentNode.removeChild(bd);
}
</script>
