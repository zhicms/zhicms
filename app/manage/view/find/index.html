<script>
// 全选/取消全选
function toggleAll() {
    var all = document.getElementById('selectAll').checked;
    var boxes = document.querySelectorAll('.row-checkbox');
    for (var i = 0; i < boxes.length; i++) {
        boxes[i].checked = all;
    }
    updateBatchBtns();
}

// 显示/隐藏批量按钮
function updateBatchBtns() {
    var checked = document.querySelectorAll('.row-checkbox:checked').length;
    document.getElementById('batchBtnGroup').style.display = checked > 0 ? '' : 'none';
}

// 获取选中的 ID
function getSelectedIds() {
    var ids = [];
    var boxes = document.querySelectorAll('.row-checkbox:checked');
    for (var i = 0; i < boxes.length; i++) {
        ids.push(boxes[i].value);
    }
    return ids.join(',');
}

// 批量操作
function batchAction(action) {
    var ids = getSelectedIds();
    if (!ids) { alert('请先选择要操作的文章'); return; }
    var titles = { publish: '批量发布', unpublish: '批量取消发布', delete: '批量删除' };
    var msg = titles[action] || action;
    if (action === 'delete') {
        if (!confirm('确定要' + msg + '这 ' + ids.split(',').length + ' 篇文章吗？此操作不可恢复！')) return;
    } else {
        if (!confirm('确定要' + msg + '这 ' + ids.split(',').length + ' 篇文章吗？')) return;
    }
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=manage/find/batch', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4) {
            if (xhr.status == 200) {
                try {
                    var r = JSON.parse(xhr.responseText);
                    alert(r.info);
                    location.reload();
                } catch(e) {
                    alert('操作异常: ' + xhr.responseText.substring(0, 200));
                }
            } else {
                alert('请求失败 HTTP ' + xhr.status);
            }
        }
    };
    xhr.send('action=' + encodeURIComponent(action) + '&ids=' + encodeURIComponent(ids));
}

function search() {
    var keyword = document.getElementById('keyword').value;
    var url = 'index.php?r=manage/find/index';
    if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
    location.href = url;
}

function delItem(id) {
    if(confirm('确定要删除这篇文章吗？此操作不可恢复！')) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'index.php?r=manage/find/del&id=' + id, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                try {
                    var result = JSON.parse(xhr.responseText);
                    if (result.status === 'y') {
                        alert(result.info);
                        location.reload();
                    } else {
                        alert(result.info);
                    }
                } catch(e) {
                    alert('删除失败，响应数据异常');
                }
            }
        };
        xhr.send();
    }
}

// 键盘事件 - 回车搜索
document.getElementById('keyword').addEventListener('keypress', function(e) {
    if(e.which === 13) {
        search();
    }
});

// 一键采集（好单库朋友圈）
function openCollectModal() {
    document.getElementById('collectModal').style.display = 'flex';
    var btn = document.getElementById('collectConfirmBtn');
    btn.disabled = false;
    btn.innerText = '开始采集';
    btn.onclick = function() {
        var cid = document.getElementById('collectCate').value;
        var pages = document.getElementById('collectPages').value || 5;
        btn.disabled = true;
        btn.innerText = '采集中（请耐心等待）...';
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'index.php?r=manage/find/collect&cid=' + cid + '&pages=' + pages, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                try {
                    var r = JSON.parse(xhr.responseText);
                    alert(r.info);
                    if (r.status === 'y') {
                        setTimeout(function() { location.reload(); }, 1500);
                    }
                } catch(e) {
                    alert('采集异常，请稍后重试');
                }
                closeCollectModal();
            }
        };
        xhr.send();
    };
}

function closeCollectModal() {
    var m = document.getElementById('collectModal');
    if (m) m.style.display = 'none';
    var btn = document.getElementById('collectConfirmBtn');
    if (btn) { btn.disabled = false; btn.innerText = '开始采集'; }
    var input = document.getElementById('collectPages');
    if (input) input.value = '5';
}

// 点击背景 / Esc 关闭采集弹窗
document.getElementById('collectModal').addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        var m = document.getElementById('collectModal');
        if (m && m.style.display !== 'none') m.style.display = 'none';
    }
});
</script>
