<!-- TinyMCE 编辑器加载 -->
<script src="https://tinymce.vt5.cn/tinymce.min.js"></script>
<script src="/public/manage/js/tinymce-init.js"></script>

<script>
$(function() {
    // 初始化 TinyMCE 编辑器
    if (typeof initZhiCmsEditor === 'function') {
        initZhiCmsEditor('#article-editor', {
            uploadType: 'article',
            height: 550
        });
    }

    // 表单提交前处理
    $('#form').on('submit', function() {
        if (typeof tinymce !== 'undefined') {
            const editor = tinymce.get('article-editor');
            if (editor) {
                // 将商品链接转换回 [ZhiCmsUrl] 标签
                if (typeof convertHtmlToZhiCmsUrlTags === 'function') {
                    convertHtmlToZhiCmsUrlTags(editor);
                }
                // 同步到 textarea
                editor.save();
            }
        }
    });
});

function upthis(){
    document.getElementById("up_file").click(); 	
}

function upimg() {
    var fileInput = document.getElementById("up_file");
    zhicmsUpload('articlepic', 'up_file', function(url) {
        $('#picbox').val(url);
        $('#showimg').attr('src', url).show();
    });
}
</script>
