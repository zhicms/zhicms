function del(id) {
    if(confirm('确定要删除这个分类吗？若分类下还有文章将禁止删除。')) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'index.php?r=manage/find/deleteType&id=' + id, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                try {
                    var result = JSON.parse(xhr.responseText);
                    if (result.status === 'y') {
                        location.reload();
                    } else {
                        alert(result.info);
                    }
                } catch(e) {
                    location.reload();
                }
            }
        };
        xhr.send();
    }
}
</script>
