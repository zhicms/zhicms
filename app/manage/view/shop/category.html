.shop-modal-footer .btn { margin-left:8px; }
</style>

<script>
function openForm(id, name, sort, status) {
    id = id || 0;
    document.getElementById('catId').value = id;
    document.getElementById('formTitle').textContent = id > 0 ? '编辑分类' : '新增分类';
    document.getElementById('catName').value = name || '';
    document.getElementById('catSort').value = (typeof sort !== 'undefined') ? sort : 0;
    document.getElementById('catStatus').value = (typeof status !== 'undefined') ? status : 1;
    var m = document.getElementById('formModal');
    m.classList.remove('d-none'); m.style.display = 'flex';
}
function closeForm() {
    var m = document.getElementById('formModal');
    m.style.display = 'none'; m.classList.add('d-none');
}
function saveCat() {
    var id = document.getElementById('catId').value;
    var name = document.getElementById('catName').value.trim();
    var sort = document.getElementById('catSort').value;
    var status = document.getElementById('catStatus').value;
    if (!name) { showToast('请填写分类名称', 'danger'); return; }
    var token = document.getElementById('csrfToken').value;
    var btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = '保存中...';
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=manage/shop/categorySave&_token=' + token, true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            btn.disabled = false; btn.textContent = '保存';
            try {
                var r = JSON.parse(xhr.responseText);
                if (r.status === 'y') { showToast(r.info, 'success'); closeForm(); setTimeout(function(){ location.reload(); }, 800); }
                else { showToast(r.info || '保存失败', 'danger'); }
            } catch(e) { showToast('响应异常', 'danger'); }
        }
    };
    xhr.send('id=' + id + '&name=' + encodeURIComponent(name) + '&sort=' + sort + '&status=' + status);
}
function delCat(id) {
    if (!confirm('确定删除该分类？')) return;
    var token = document.getElementById('csrfToken').value;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=manage/shop/categoryDel&_token=' + token, true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            try {
                var r = JSON.parse(xhr.responseText);
                if (r.status === 'y') { showToast(r.info, 'success'); setTimeout(function(){ location.reload(); }, 800); }
                else { showToast(r.info || '删除失败', 'danger'); }
            } catch(e) { showToast('响应异常', 'danger'); }
        }
    };
    xhr.send('id=' + id);
}
function showToast(message, type) {
    type = type || 'success';
    var toast = document.createElement('div');
    toast.className = 'toast align-items-center text-white bg-' + type + ' border-0 position-fixed show';
    toast.setAttribute('role', 'alert');
    toast.style.cssText = 'top:20px;right:20px;z-index:9999;min-width:280px;opacity:1;transition:opacity .3s ease;';
    toast.innerHTML = '<div class="d-flex"><div class="toast-body"><i class="fas fa-' + (type==='success'?'check-circle':'exclamation-circle') + ' mr-2"></i>' + message + '</div><button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.parentElement.parentElement.remove()"></button></div>';
    document.body.appendChild(toast);
    setTimeout(function(){ toast.style.opacity='0'; setTimeout(function(){ if(toast.parentNode) toast.parentNode.removeChild(toast); }, 350); }, 3000);
}
document.getElementById('formModal').addEventListener('click', function(e){ if(e.target===this) closeForm(); });
</script>
