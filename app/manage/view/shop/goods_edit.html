<script>
function pickImage() { document.getElementById('coverFile').click(); }
function uploadImage() {
    var f = document.getElementById('coverFile').files[0];
    if (!f) return;
    var token = document.getElementById('csrfToken').value;
    var fd = new FormData();
    fd.append('file', f);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=manage/File/upload&type=shop&field=file&_token=' + token, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            try {
                var r = JSON.parse(xhr.responseText);
                if (r.status === 'y' && r.url) {
                    document.getElementById('cover').value = r.url;
                    var prev = document.getElementById('coverPrev');
                    if (prev) { prev.src = r.url; } else {
                        var img = document.createElement('img');
                        img.id = 'coverPrev'; img.src = r.url;
                        img.style.cssText = 'width:80px;height:80px;object-fit:cover;margin-top:8px;border-radius:6px;';
                        document.getElementById('cover').parentNode.appendChild(img);
                    }
                    showToast('封面上传成功', 'success');
                } else { showToast(r.info || '上传失败', 'danger'); }
            } catch(e) { showToast('上传响应异常', 'danger'); }
        }
    };
    xhr.send(fd);
}
function saveGoods() {
    var id = document.getElementById('goodsId').value;
    var title = document.getElementById('title').value.trim();
    var price = document.getElementById('price').value;
    if (!title) { showToast('请填写商品标题', 'danger'); return; }
    if (!price || parseFloat(price) <= 0) { showToast('售价必须大于0', 'danger'); return; }
    var token = document.getElementById('csrfToken').value;
    var btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 保存中...';
    var data = 'id=' + id
        + '&cat_id=' + document.getElementById('cat_id').value
        + '&title=' + encodeURIComponent(title)
        + '&subtitle=' + encodeURIComponent(document.getElementById('subtitle').value)
        + '&cover=' + encodeURIComponent(document.getElementById('cover').value)
        + '&images=' + encodeURIComponent(document.getElementById('images').value)
        + '&price=' + price
        + '&original_price=' + document.getElementById('original_price').value
        + '&stock=' + document.getElementById('stock').value
        + '&sort=' + document.getElementById('sort').value
        + '&status=' + document.getElementById('status').value
        + '&content=' + encodeURIComponent(document.getElementById('content').value);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'index.php?r=manage/shop/goodsSave&_token=' + token, true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> 保存';
            try {
                var r = JSON.parse(xhr.responseText);
                if (r.status === 'y') { showToast(r.info, 'success'); setTimeout(function(){ location.href='index.php?r=manage/shop/goods'; }, 800); }
                else showToast(r.info || '保存失败', 'danger');
            } catch(e) { showToast('响应异常', 'danger'); }
        }
    };
    xhr.send(data);
}
function showToast(message, type) {
    type = type || 'success';
    var toast = document.createElement('div');
    toast.className = 'toast align-items-center text-white bg-' + type + ' border-0 position-fixed show';
    toast.setAttribute('role', 'alert');
    toast.style.cssText = 'top:20px;right:20px;z-index:9999;min-width:280px;opacity:1;transition:opacity .3s ease;';
    toast.innerHTML = '<div class="d-flex"><div class="toast-body"><i class="fas fa-' + (type==='success'?'check-circle':'exclamation-circle') + ' mr-2"></i>' + message + '</div><button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.parentElement.parentElement.remove()"></button></div>';
    document.body.appendChild(toast);
    setTimeout(function(){ toast.style.opacity='0'; setTimeout(function(){ if(toast.parentNode) toast.parentNode.removeChild(toast); }, 350); }, 3000);
}
</script>
