<!-- 插件公共头部：导航 + 搜索（仿 kiees.com 配色，可被所有页面复用） -->
<nav class="gd-header">
  <div class="gd-header-inner">
    <a class="gd-logo" href="{$plug_url}" title="{$site_name}">
      {if !empty($site_logo)}<img src="{$site_logo}" alt="{$site_name}">{else}<span>{$site_name}</span>{/if}
    </a>
    <ul class="gd-nav">
      <li{if $mod!='cheaps' && $mod!='brand' && $mod!='rank' && empty($is_search)} class="active"{/if}><a href="{$plug_url}">首页</a></li>
      <li{if $mod=='cheaps'} class="active"{/if}><a href="{$nav_cheaps}">优惠券</a></li>
      <li{if $mod=='brand'} class="active"{/if}><a href="{$nav_brand}">大牌</a></li>
      <li{if $mod=='rank'} class="active"{/if}><a href="{$nav_rank}">风云榜</a></li>
    </ul>
    <form class="gd-search" method="get" action="{$plug_url}">
      <input type="text" name="kw" placeholder="搜索优惠券 / 文章" value="{if !empty($keyword)}{$keyword|htmlspecialchars}{/if}" />
      <button type="submit">搜索</button>
    </form>
  </div>
</nav>
