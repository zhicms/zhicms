# ============================================================
# ZhiCms Nginx 完整配置（独立可部署版，适配站点 server{} 块）
# ------------------------------------------------------------
# 用法：将本文件内容粘贴到 Nginx 站点的 server{} 块内（或 include 本文件）。
# 策略与同目录 nginx.htaccess（被 vhost include 的精简版）、.htaccess（Apache 版）完全一致：
#   - 伪静态 rewrite 到 /index.php（交由框架 rule.php 解析业务路由）
#   - 禁止 Web 访问敏感目录（data / runtime / vendor / .git / .svn）
#   - 禁止下载敏感文件类型
#   - 防挂马：默认禁止所有 .php 执行，仅白名单放行 index.php / sitemap.php
#
# 注意：
#   - PHP 端口：请与你的 PHP-FPM / PhpStudy 实际监听端口一致（本机 PhpStudy Nginx 默认 9000）。
#   - 安全 deny 规则必须放在通用 php 解析段【之前】，确保 deny 优先于 php 执行。
#   - 以下规则若直接 include 进 server 层，请勿再嵌套在 location / 内部。
# ============================================================



    # 1) 伪静态（必需）：不存在的文件/目录统一转发到 index.php
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php last;
        }
    }

    # 2) 禁止 Web 访问敏感目录（返回 404，不暴露“文件存在”）
    location ^~ /data/    { deny all; return 404; }
    location ^~ /runtime/ { deny all; return 404; }
    location ~ ^/(\.git|\.svn|vendor|composer\.(json|lock))(/|$) { deny all; return 404; }

    # 3) 禁止直接下载敏感文件类型（配置、备份、SQL、日志、密钥、锁文件）
    location ~* \.(sql|log|bak|ini|lock|env|key|pem|crt)$ {
        deny all;
        return 404;
    }

    # 4) 防挂马核心规则：默认禁止【除白名单入口外】所有 .php 执行
    #    白名单仅放行 /index.php、/sitemap.php（精确路径），其余 .php/.php5/.phtml/.pht/.phps 一律拒绝。
    #    install.php / build-classmap.php / rebuild-classmap.php / classmap.php 等构建/安装脚本禁止 Web 访问。
    #    注意：端口必须与下方通用 php 解析段一致（本机 PhpStudy 为 9000），否则首页会被当静态文件下载。
    location ~ ^/(index|sitemap)\.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_split_path_info  ^((?U).+\.php)(/?.+)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO  $fastcgi_path_info;
        fastcgi_param  PATH_TRANSLATED  $document_root$fastcgi_path_info;
        include        fastcgi_params;
    }
    location ~* \.(php|php5|phtml|pht|phps)$ {
        deny all;
        return 404;
    }

    # 5) 通用 PHP 解析段（端口与白名单一致；白名单已前置，仅处理非 index/sitemap 的 php 入口）
    location ~ \.php(.*)$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_split_path_info  ^((?U).+\.php)(/?.+)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO  $fastcgi_path_info;
        fastcgi_param  PATH_TRANSLATED  $document_root$fastcgi_path_info;
        include        fastcgi_params;
    }

    # 6) 静态资源缓存（可选，提升性能）
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

