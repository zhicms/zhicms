# ZhiCms Nginx 配置片段
# 用法：把本文件内容粘贴到站点 server{} 块中，或用 include 引入

# 1) 伪静态（必需）
location / {
    if (!-e $request_filename) {
        rewrite ^(.*)$ /index.php last;
    }
}

# 2) 安全加固（强烈建议保留）
# 禁止访问运行时目录：内含缓存、日志、AI凭证(access_token)等敏感数据
location ~ ^/(runtime|data/config)/ {
    deny all;
    return 404;
}

# 禁止直接下载数据库配置、备份、SQL 与日志文件
location ~* \.(sql|log|bak|ini|lock)$ {
    deny all;
    return 404;
}

# 禁止访问版本控制与依赖目录
location ~ ^/(\.git|\.svn|vendor|composer\.(json|lock))(/|$) {
    deny all;
    return 404;
}

# 3) 上传目录禁止执行 PHP（防止上传木马被解析）
location ~* ^/upload/.*\.(php|php5|phtml)$ {
    deny all;
    return 404;
}

# 4) 静态资源缓存（可选，提升性能）
location ~* \.(css|js|png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
}
